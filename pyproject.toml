[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "olmoearth-agent"
version = "0.0.0"
description = "A tool that drives the OlmoEarth Studio platform from natural-language briefs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OlmoEarth Agent contributors" }]
keywords = ["olmoearth", "earth-observation", "agent", "geospatial", "vlm"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.50",  # OpenAI-compatible client used to talk to vLLM (see docs/serving.md)
    "httpx>=0.27",   # async HTTP client for the OlmoEarth Studio API
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",  # mock vLLM endpoint for tests/llm
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "interrogate>=1.7",
    "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/2imi9/OlmoEarth-Agent"
Repository = "https://github.com/2imi9/OlmoEarth-Agent"
Issues = "https://github.com/2imi9/OlmoEarth-Agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/olmoearth_agent"]

# --- Formatter / linter / type checker ---

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "S", "I", "PERF"]
ignore = ["E501"]  # line length deferred to Black

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts allowed in tests

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["src/olmoearth_agent"]

[tool.interrogate]
fail-under = 90
verbose = 2
exclude = ["tests", "build", "docs"]

# --- Tests / coverage ---

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "integration: tests that require a live external service (OlmoEarth Studio API key OLMOEARTH_API_KEY, or LLM server LLM_ENDPOINT)",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/olmoearth_agent"]
branch = true

[tool.coverage.report]
# Coverage gate activates once test code exists; vacuous on an empty package.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
