<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OlmoEarth label sheet</title>
<script type="importmap">{"integrity": {"@EXT_APPS_URL@": "@EXT_APPS_SRI@"}}</script>
<link rel="modulepreload" href="@EXT_APPS_URL@" integrity="@EXT_APPS_SRI@" crossorigin="anonymous">
</head>
<body>
<main id="root" class="stack"><div class="muted">Loading the sheet...</div></main>
<script>
// WORDING: r4k K2
setTimeout(function(){if(!window.OE_STARTED){var r=document.getElementById('root');if(r)r.textContent='This card could not start here. Carry on in the chat.';}},10000);
</script>
<script type="module">
import { App } from "@EXT_APPS_URL@";
/*@SCRIPTS@*/

const root = document.getElementById('root');

/* The tool's result holds the sheet's counts only (sheet.sheet_progress), never
   a row: the page copy (each window by a handle, sheet.read_sheet) is read from
   the file each time the view shows, so a host that shows this view again later
   (a reopened chat) shows the sheet as it is now. A read that fails says so; there is no older copy to show. */
async function show(app, params) {
  const data = OE.viewData(params);
  if (params.isError || !data.path) {
    const text = (params.content || []).map((c) => c.text || '').join(' ');
    let message = text;
    try { message = JSON.parse(text).error || text; } catch (_) { /* plain text */ }
    root.replaceChildren(OE.el('div', { class: 'card error' }, message || 'The sheet could not be opened.'));
    return;
  }
  let fresh;
  try {
    fresh = await OE.call(app, 'olmoearth_app_sheet', { labels_csv_path: data.path });
  } catch (err) {
    root.replaceChildren(OE.el('div', { class: 'card error' }, 'The sheet could not be read: ' + err.message));
    return;
  }
  // The example pictures beside the owner's rule (r4-k K9), when the server
  // gave them with the view's data and not with the sheet: the editor shows
  // them only beside the owner's rule (OE.ruleExamples).
  const page = fresh && !fresh.examples && data.examples ? { ...fresh, examples: data.examples } : fresh;
  // 'Full screen' as a small outlined button at the card's top right, only
  // where the host offers it ('Back to the chat' in full screen); its answer
  // lays the face out for the mode. An editor drawn before (the view shown
  // again) drops its timers and listeners.
  OE.disposeEditors(root);
  root.replaceChildren(OE.sheetEditor(app, page, { headerAction: OE.fullscreenButton(app, OE.sheetMode) }));
}

await OE.start('olmoearth-label-sheet', {
  onResult: (params, app) => show(app, params),
  // The host's display mode (full screen, and back): the face's dates follow it.
  onContext: (ctx) => OE.sheetMode(ctx.displayMode),
});
</script>
</body>
</html>
