<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OlmoEarth Agent start</title>
<script type="importmap">{"integrity": {"@EXT_APPS_URL@": "@EXT_APPS_SRI@"}}</script>
<link rel="modulepreload" href="@EXT_APPS_URL@" integrity="@EXT_APPS_SRI@" crossorigin="anonymous">
<style>
  /* r5-f F16: the canvas and the text before the module runs, and when it
     cannot start (the watchdog's line): OE.STYLE's own canvas and text
     colours and a system sans-serif, which OE.STYLE takes over from once
     the module runs. */
  html { background: #faf2e9; }
  body { margin: 0; padding: 0 16px 16px; font: 14px/21px system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0a3235; }
  /* The jobs (r5-e S2): one column of tiles, one per job, each a button
     that holds the job's label and its one line, so the line sits inside the
     job's own box; every tile is as wide as the column and at least 86 px
     tall (the label, two small lines, the padding and the border), so the
     tiles are one size at every width. A message to copy sits under its
     tile; a small heading over the other jobs. Signed out the tiles are off
     (a flat edge, no dark fill, "Sign in to start a job." over them at body
     size in the body colour, r5-i B8), but
     each label and each line keeps a readable colour (r5-f F03: the label
     took the disabled grey, 1.9:1 on white, under its own readable line). */
  .items { list-style: none; margin: 0; padding: 0; }
  .items.jobs { display: grid; grid-template-columns: minmax(0, 1fr); }
  .jobs li { padding: 4px 0; }
  .jobs li > button.job { width: 100%; min-height: 86px; display: flex; flex-direction: column; justify-content: center;
    align-items: flex-start; gap: 2px; padding: 10px 16px; text-align: left; }
  .jobs .job-label { font-weight: 600; }
  .jobs .job-line { font-size: 12px; line-height: 18px; font-weight: 400; }
  .jobs button.job:disabled .job-label, .jobs button.job:disabled .job-line { color: var(--text-2); }
  .jobs li.jobs-head > h2 { font-size: 12px; line-height: 18px; font-weight: 600; color: var(--text-2); }
  /* The overview figure (overview.js), its one small caption and the docs
     link in the caption's line, sized as it (r5-a V1), underlined, so more
     than its weight tells it from the caption's words (r5-c S13); all three
     in one white box (r5-e S3), so the caption and the link do not sit loose
     on the canvas under the figure. The box is as wide as its figure, not
     the panel (the strip's 440 px, the docs figure's 748 px, plus the box's
     own 24 px of padding and 2 px of edge), so no blank white band stands
     beside the figure on a panel wider than it. */
  .oe-overview-wrap { background: var(--paper); border: 1px solid var(--divider); border-radius: 12px;
    padding: 8px 12px 10px; max-width: 466px; }
  @media (min-width: 680px) { .oe-overview-wrap { max-width: 774px; } }
  .oe-overview-cap { margin-top: 6px; }
  .oe-overview-cap button.link { font-size: 12px; line-height: 18px; padding: 0 4px;
    text-decoration: underline; text-underline-offset: 2px; }
  /* The sign-in note's last line (r5-g G2): "Request access", a text button
     inside the sentence, at the sentence's size and line height with no
     padding, so the words around it keep their spacing and the line its
     height; underlined as the docs link is (r5-c S13). */
  .oe-access button.link { font-size: 14px; line-height: 21px; padding: 0;
    text-decoration: underline; text-underline-offset: 2px; }
</style>
</head>
<body>
<main id="root" class="stack"><div class="muted">Loading...</div></main>
<script>
// WORDING: r4k K2
setTimeout(function(){if(!window.OE_STARTED){var r=document.getElementById('root');if(r)r.textContent='This card could not start here. Carry on in the chat.';}},10000);
</script>
<script type="module">
import { App } from "@EXT_APPS_URL@";
/*@SCRIPTS@*/

const root = document.getElementById('root');

/* What the start card says about the key while signed out: what a key is
   and where Studio makes one (B/S4), then where the key goes, in the words
   of every other sign-in text (OE.SIGN_IN_KEY_GOES, r5-d R12). Then, a line
   of its own at the end (accessLine), what to do without a Studio account
   (r4-h P1: A/F15, E/start-3; r5-g G2, the owner's words of 18 Nov 2026):
   ask for one with OlmoEarth's own "Request access", never use someone
   else's key. */
// WORDING: r5g
// WORDING: r5d R12
const KEY_NOTE = 'You need your own Studio API key: a secret code that Studio makes for you (in Studio, open your profile, then API Keys). The key goes to the OlmoEarth Agent here, not through Claude.';
// WORDING: r5g
const ACCESS_BEFORE = 'No Studio account? ';
// WORDING: r5g
const ACCESS_AFTER = ' on olmoearth.allenai.org. Do not use someone else\'s key.';

/* The note's last line (r5-g G2): its words around OE.accessLink's text
   button ("Request access", which the host opens at OlmoEarth's site), then
   the link's slot, inside the line, which shows the address to copy when the
   host does not open it. Signed out only: the sign-in panel, which holds the
   note, is drawn only then (a signed-in user has an account). */
function accessLine(app) {
  const [access, address] = OE.accessLink(app);
  return OE.el('div', { class: 'oe-access' }, ACCESS_BEFORE, access, ACCESS_AFTER, address);
}

/* The card's one line under its title (OE.lead): what to do next (r5-e S1,
   the owner's note 3: the title already says what the card is, and what a
   check cannot tell is said where labelling happens, on the Check card and
   the sheet). Nothing folds on this card. Under it, the overview figure
   (overviewBlock, r5-a V1); who is signed in is in the top line
   (OE.setAccount, r5-a V2), not on the card. Signed in, the line no longer
   asks to sign in (START_NEXT_IN, r5-c S03). */
// WORDING: r5e
const START_LEAD = { next: 'Sign in first, then press a job or ask Claude in the chat.' };
// WORDING: r5e
const START_NEXT_IN = 'Press a job, or ask Claude in the chat.';

/* Each drawing of the card takes the next number; the status read on mount,
   when it answers after a later drawing, is dropped. */
let generation = 0;

/* Signed in: a key in effect that Studio has not refused. */
const signedIn = (status) => Boolean(status && status.signed_in && !status.key_problem);

/* One job: a button that sends its request to Claude as the user's words
   (OE.sendJob: a message the host does not take shows under the row, to
   type). The button holds the job's label and its one line (r5-e S2: the
   line inside the job's own box, not loose under it); its name is the label
   alone and the line its description. The main job's button is the card's
   one contained button once signed in (the sign-in holds that role while
   signed out); the others are outlined. Off (disabled) while signed out;
   aria-disabled while its message is being sent, so it keeps the focus. */
function jobRow(app, job, on) {
  const slot = OE.typeSlot();
  let busy = false;
  const main = job.main === true;
  const lineId = 'job-line-' + job.key;
  const button = OE.el('button', { type: 'button', class: 'job' + (main && on ? ' primary' : ''), disabled: !on, 'aria-label': job.label, 'aria-describedby': lineId },
    OE.el('span', { class: 'job-label' }, job.label), OE.el('span', { class: 'job-line', id: lineId }, job.line));
  button.addEventListener('click', async () => {
    if (busy || button.disabled) return;
    busy = true;
    button.setAttribute('aria-disabled', 'true');
    try { await OE.sendJob(app, job.message, slot); } finally {
      busy = false;
      button.setAttribute('aria-disabled', 'false');
    }
  });
  return OE.el('li', { class: main ? 'main' : null }, button, slot);
}

/* The jobs in one column of tiles: the main job's row first (the server
   marks it; the first job when none is marked), then a row with the
   heading "Other jobs", then the rest. */
function jobRows(app, jobs, on) {
  const marked = jobs.findIndex((j) => j && j.main === true);
  const at = marked >= 0 ? marked : 0;
  const main = { ...jobs[at], main: true };
  const others = jobs.filter((_, i) => i !== at);
  return [
    jobRow(app, main, on),
    // WORDING: held for the reader test
    others.length ? OE.el('li', { class: 'jobs-head' }, OE.el('h2', {}, 'Other jobs')) : null,
    ...others.map((job) => jobRow(app, job, on)),
  ];
}

/* The overview figure (OE.overview.figure, a role=img element) and, under
   it and outside it, its one small caption with the docs link after the
   words (OE.docsLink: a text button, and the slot that shows the address
   when the host does not open it), all three in one white box (r5-e S3:
   .oe-overview-wrap). The same signed in and signed out. The
   caption's words are two spans, one shown at a time (r5-d R04, overview.js
   STYLE): the docs figure's (cap-wide) from 680 px up, the narrow strip's
   (cap-narrow) below, so the caption says what is shown. */
function overviewBlock(app) {
  const [docs, address] = OE.docsLink(app);
  return OE.el('div', { class: 'oe-overview-wrap' },
    OE.overview.figure(),
    OE.el('div', { class: 'small muted oe-overview-cap' },
      OE.el('span', { class: 'cap-wide' }, OE.overview.CAPTION),
      OE.el('span', { class: 'cap-narrow' }, OE.overview.CAPTION_NARROW), ' ', docs, address));
}

/* After Sign out (the top line's button, the user's own press): the card is
   drawn again from the sign-out's result. The button pressed is gone, so
   the focus goes to the card's one contained button: the sign-in's; or,
   when the key the app was installed with is still in effect (the result
   says signed in, and the top line then draws no Sign out, r5-c S01), the
   main job's. Only while this panel's frame has the focus (OE.focusIfHere). */
function signedOut(app, data, result) {
  render(app, { ...data, status: result });
  OE.focusIfHere(root.querySelector('button.primary'));
}

function render(app, data) {
  generation += 1;
  const status = data.status || {};
  const on = signedIn(status);
  const jobs = Array.isArray(data.jobs) ? data.jobs : [];
  // The account in the top line, set at every drawing, signed in or out, so
  // a name never outlasts its sign-in; with the key the app was installed
  // with (its source), no Sign out (r5-c S01).
  OE.setAccount(app, { signedIn: on, account: status.account, source: status.source, onSignOut: (s) => signedOut(app, data, s) });
  root.replaceChildren(OE.el('h1', {}, 'What this app can do'));
  const lead = OE.lead(on ? { ...START_LEAD, next: START_NEXT_IN } : START_LEAD);
  if (lead) root.append(lead);
  root.append(overviewBlock(app));
  if (!on) {
    if (status.key_problem) root.append(OE.el('div', { class: 'card error small' }, status.key_problem));
    root.append(OE.signInPanel(app, {
      acceptCurrent: true,  // a sign-in made in another panel counts here
      // The note's two lines: the key, then Request access (r5-g G2).
      note: [KEY_NOTE, accessLine(app)],
      onDone: (s) => {
        render(app, { ...data, status: s });
        // The user pressed the sign-in's button: the focus goes on to the first job.
        OE.focusIfHere(root.querySelector('.jobs button'));
      },
    }));
  }
  if (!jobs.length) {
    root.append(OE.el('div', { class: 'faint' }, 'Ask Claude what this app can do.'));
    return;
  }
  // Why the tiles are off stands over them, inside the jobs card, not loose under the last tile's box (r5-e R2),
  // at body size in the body colour (r5-i B8: small and grey, it was the only word that the tiles are off).
  root.append(OE.el('section', { class: 'card stack' },
    on ? null : OE.el('div', {}, 'Sign in to start a job.'),
    OE.el('ul', { class: 'items jobs', 'aria-label': 'Jobs' }, jobRows(app, jobs, on))));
}

/* What the top line draws for a status (OE.setAccount): null signed out;
   signed in, its words (whose account, or the app's own key, which has no
   Sign out: r5-c S01) and the account its spoken name gives. */
const drawnAs = (s) => (signedIn(s)
  ? OE.accountShort(s.account, s.source) + '|' + OE.accountShort(s.account) : null);

/* Once, when the card opens: whether the user signed in or out, or another key
   or account is now in effect, since the tool ran (a card reopened from the
   history). It moves no focus; when it fails, the card stays as drawn. */
async function recheck(app, data) {
  const mine = generation;
  let now = null;
  try { now = await OE.call(app, 'olmoearth_app_status'); } catch (err) { return; }
  if (mine !== generation || !now) return;
  if (drawnAs(now) !== drawnAs(data.status)) render(app, { ...data, status: now });
}

await OE.start('olmoearth-start', {
  onResult: (params, app) => {
    const data = OE.viewData(params);
    render(app, data);
    recheck(app, data);
  },
});
</script>
</body>
</html>
