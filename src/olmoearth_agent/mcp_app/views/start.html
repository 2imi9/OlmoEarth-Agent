<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OlmoEarth Agent start</title>
<script type="importmap">{"integrity": {"@EXT_APPS_URL@": "@EXT_APPS_SRI@"}}</script>
<link rel="modulepreload" href="@EXT_APPS_URL@" integrity="@EXT_APPS_SRI@" crossorigin="anonymous">
<style>
  /* r5-f F16: the canvas and the text before the module runs, and when it
     cannot start (the watchdog's line): OE.STYLE's own canvas and text
     colours and a system sans-serif, which OE.STYLE takes over from once
     the module runs. */
  html { background: #faf2e9; }
  body { margin: 0; padding: 0 16px 16px; font: 14px/21px system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0a3235; }
  /* The jobs (r5-e S2): one column of tiles, one per job, each a button
     that holds the job's label and its one line, so the line sits inside the
     job's own box; every tile is as wide as the column and at least 86 px
     tall (the label, two small lines, the padding and the border), so the
     tiles are one size at every width. A message to copy sits under its
     tile; a small heading over the other jobs. Signed out the tiles are off
     (a flat edge, no dark fill, "Sign in to start a job." over them at body
     size in the body colour, r5-i B8), but
     each label and each line keeps a readable colour (r5-f F03: the label
     took the disabled grey, 1.9:1 on white, under its own readable line). */
  .items { list-style: none; margin: 0; padding: 0; }
  .items.jobs { display: grid; grid-template-columns: minmax(0, 1fr); }
  .jobs li { padding: 4px 0; }
  .jobs li > button.job { width: 100%; min-height: 86px; display: flex; flex-direction: column; justify-content: center;
    align-items: flex-start; gap: 2px; padding: 10px 16px; text-align: left; }
  .jobs .job-label { font-weight: 600; }
  .jobs .job-line { font-size: 12px; line-height: 18px; font-weight: 400; }
  .jobs button.job:disabled .job-label, .jobs button.job:disabled .job-line { color: var(--text-2); }
  /* r5-o T2: the tiles off after one job's message reached the chat (OE.lockJobs) stay readable too. */
  .jobs button.job[data-oe-locked] .job-label, .jobs button.job[data-oe-locked] .job-line { color: var(--text-2); }
  .jobs li.jobs-head > h2 { font-size: 12px; line-height: 18px; font-weight: 600; color: var(--text-2); }
  /* The overview figure (overview.js), its one small caption and the docs
     link in the caption's line, sized as it (r5-a V1), underlined, so more
     than its weight tells it from the caption's words (r5-c S13); all three
     in one white box (r5-e S3), so the caption and the link do not sit loose
     on the canvas under the figure. The box is as wide as its figure, not
     the panel (the strip's 440 px, the docs figure's 748 px, plus the box's
     own 24 px of padding and 2 px of edge), so no blank white band stands
     beside the figure on a panel wider than it. */
  .oe-overview-wrap { background: var(--paper); border: 1px solid var(--divider); border-radius: 12px;
    padding: 8px 12px 10px; max-width: 466px; }
  @media (min-width: 680px) { .oe-overview-wrap { max-width: 774px; } }
  .oe-overview-cap { margin-top: 6px; }
  .oe-overview-cap button.link { font-size: 12px; line-height: 18px; padding: 0 4px;
    text-decoration: underline; text-underline-offset: 2px; }
  /* The sign-in note's last line (r5-g G2): "Request access", a text button
     inside the sentence, at the sentence's size and line height with no
     padding, so the words around it keep their spacing and the line its
     height; underlined as the docs link is (r5-c S13). */
  .oe-access button.link { font-size: 14px; line-height: 21px; padding: 0;
    text-decoration: underline; text-underline-offset: 2px; }
</style>
</head>
<body>
<main id="root" class="stack"><div class="muted">Loading...</div></main>
<script>
// WORDING: r4k K2
setTimeout(function(){if(!window.OE_STARTED){var r=document.getElementById('root');if(r)r.textContent='This card could not start here. Carry on in the chat.';}},10000);
</script>
<script type="module">
import { App } from "@EXT_APPS_URL@";
/*@SCRIPTS@*/

const root = document.getElementById('root');

/* What the start card says about the key while signed out: what a key is
   and where Studio makes one (B/S4), then where the key goes, in the words
   of every other sign-in text (OE.SIGN_IN_KEY_GOES, r5-d R12). Then, a line
   of its own at the end (accessLine), what to do without a Studio account
   (r4-h P1: A/F15, E/start-3; r5-g G2, the owner's words of 18 Nov 2026):
   ask for one with OlmoEarth's own "Request access", never use someone
   else's key. */
// WORDING: r5g
// WORDING: r5d R12
const KEY_NOTE = 'You need your own Studio API key: a secret code that Studio makes for you (in Studio, open your profile, then API Keys). The key goes to the OlmoEarth Agent here, not through Claude.';
// WORDING: r5g
const ACCESS_BEFORE = 'No Studio account? ';
// WORDING: r5g
const ACCESS_AFTER = ' on olmoearth.allenai.org. Do not use someone else\'s key.';

/* The note's last line (r5-g G2): its words around OE.accessLink's text
   button ("Request access", which the host opens at OlmoEarth's site), then
   the link's slot, inside the line, which shows the address to copy when the
   host does not open it. Signed out only: the sign-in panel, which holds the
   note, is drawn only then (a signed-in user has an account). */
function accessLine(app) {
  const [access, address] = OE.accessLink(app);
  return OE.el('div', { class: 'oe-access' }, ACCESS_BEFORE, access, ACCESS_AFTER, address);
}

/* The card's one line under its title (OE.lead): what to do next (r5-e S1,
   the owner's note 3: the title already says what the card is, and what a
   check cannot tell is said where labelling happens, on the Check card and
   the sheet). Nothing folds on this card. Under it, on a narrow panel, the
   overview figure (overviewBlock, r5-a V1); on a wide one the jobs come
   first and the figure after them (placeOverview, r5-k K8); who is signed
   in is in the top line
   (OE.setAccount, r5-a V2), not on the card. Signed in, the line no longer
   asks to sign in (START_NEXT_IN, r5-c S03). */
// WORDING: r5e
const START_LEAD = { next: 'Sign in first, then press a job or ask Claude in the chat.' };
// WORDING: r5e
const START_NEXT_IN = 'Press a job, or ask Claude in the chat.';
/* r5-n (after review): signed out while the Asta tile is shown, the card's
   line and the line over the tiles say that the sign-in is for the Studio
   jobs, since that tile needs none (offWords); neither names the tile. */
// WORDING: r5n
const START_NEXT_STUDIO = 'Sign in first for the Studio jobs. Press a job or ask Claude in the chat.';
// WORDING: r5n
const SIGN_IN_STUDIO_JOB = 'Sign in to start a Studio job.';
/* r5-o T2 (after review): once the tiles are locked (one job at a time) no
   line of the card says to press a job: the card's line says to ask Claude
   (signed out: to sign in first, then ask), and the line over the tiles,
   which said to sign in to start a job, goes (lockedWords). r5-p J1: the
   line then ends with the Choose another job text button, so it no longer
   says to ask Claude to start another; signed out it says that one job is
   in the chat and that the Studio jobs need a sign-in (true with the Asta
   tile, which the button gives again, and without it). */
// WORDING: r5p
const START_NEXT_LOCKED = 'One job is in the chat.';
// WORDING: r5p
const START_NEXT_LOCKED_OUT = 'One job is in the chat. Sign in for the Studio jobs.';

/* Each drawing of the card takes the next number; the status read on mount,
   when it answers after a later drawing, is dropped. */
let generation = 0;

/* Signed in: a key in effect that Studio has not refused. */
const signedIn = (status) => Boolean(status && status.signed_in && !status.key_problem);

/* One job: a button that sends its request to Claude as the user's words
   (OE.sendJob: a message the host does not take shows under the row, to
   type). The button holds the job's label and its one line (r5-e S2: the
   line inside the job's own box, not loose under it); its name is the label
   alone and the line its description. The main job's button is the card's
   one contained button once signed in (the sign-in holds that role while
   signed out); the others are outlined. Off (disabled) while signed out;
   aria-disabled while its message is being sent, so it keeps the focus. One
   message per press, as OE.oncePerPress runs (r5-n JS-1): the second click
   of a fast double-click (its detail 2) does nothing, even when the host
   answered the first; a key's press (detail 0) counts. press: the row's own
   press, given the slot (the Asta tile's, astaRow); else the job's message
   is sent. r5-o T2, one job at a time: each tile is a job button and its
   slot a job's slot (OE.jobButton, the key 'start:' and the job's key), so
   OE.sendJob locks the tiles: once a tile's
   message reached the chat every tile is off (aria-disabled, greyed, its
   label and line still readable), a press does nothing, and the pressed
   tile's slot says OE.JOB_SENT_ONE; a card drawn again (a sign-in, the
   Settings switch) keeps that. */
function jobRow(app, job, on, press = null) {
  const slot = OE.typeSlot();
  let busy = false;
  const main = job.main === true;
  const lineId = 'job-line-' + job.key;
  const button = OE.el('button', { type: 'button', class: 'job' + (main && on ? ' primary' : ''), disabled: !on, 'aria-label': job.label, 'aria-describedby': lineId },
    OE.el('span', { class: 'job-label' }, job.label), OE.el('span', { class: 'job-line', id: lineId }, job.line));
  OE.jobButton(button, 'start:' + job.key, slot);
  button.addEventListener('click', async (e) => {
    if (busy || button.disabled || e.detail > 1) return;
    if (OE.jobLocked(button)) return;
    busy = true;
    button.setAttribute('aria-disabled', 'true');
    try { await (press ? press(slot) : OE.sendJob(app, job.message, slot)); } finally {
      busy = false;
      OE.jobIdle(button);
    }
  });
  return OE.el('li', { class: main ? 'main' : null }, button, slot);
}

/* r5-n S3 (the owner, 19 Nov 2026: "only people trigger it to run with
   asta"): the tile of Ai2's Asta research skills, only while the Settings
   switch is on (astaOn: from the tool's view data, data.asta, which the
   server sends only then, and from this card's Settings box,
   OE.onSettings). Under "Other jobs", after the other jobs, a tile as
   theirs (jobRow), on signed in or signed out: it needs no Studio. Its
   press is the only thing in the app that asks Claude for Asta: one
   message, ASTA_JOB.message, as the user's words, which says to ask what
   to search first, to use the quick search, and to say what a long run
   does and how long it takes and wait for a yes. Off, there is no tile and
   no word of Asta on the card. */
// WORDING: r5n
const ASTA_JOB = {
  key: 'asta',
  label: 'Search papers with Asta',
  line: 'Ai2\'s research skills find and summarise papers. Claude asks what to search first.',
  message: 'Search the scientific literature with Ai2\'s Asta skills (asta-tools). First ask me what to search for.'
    + ' Use the quick literature search. Before any long or multi-step run (Asta\'s workflows, its long-running'
    + ' assistant, a summary of many papers), tell me what it will do and roughly how long it takes, and wait for my'
    + ' yes. If the Asta skills are not available here, say so and point me to the setup page: ' + OE.SETUP_URL,
};
let astaOn = false;
/* The last drawing's jobs list ({ app, jobs, on }), where OE.onSettings adds or removes the tile; null with no list. */
let jobsDrawn = null;
/* Each state of the switch this card is told (its tool's view data, its
   Settings box, a read of its own: readSettings) takes the next number, so a
   read of its own that answers after a newer state draws nothing. */
let settingsTold = 0;

/* The Asta tile's row: a job row that is on (signed in or out), marked
   oe-asta. Its press reads the switch first (r5-n, after review: a card
   still open while the switch was turned off in another card's box): on,
   it sends its one message; off, the tile goes (OE.onSettings), nothing is
   sent, and the focus goes to the card's one contained button (the main
   job's signed in, the sign-in's signed out). A read that fails sends as
   before: the press is the user's own. */
function astaRow(app) {
  const row = jobRow(app, ASTA_JOB, true, async (slot) => {
    let state = null;
    try { state = await OE.call(app, 'olmoearth_app_settings'); } catch (_) { state = null; }
    if (state && typeof state === 'object' && !(state.asta && state.asta.on === true)) {
      OE.onSettings(state);
      OE.focusIfHere(root.querySelector('button:not(:disabled):not(.link)'));
      return false;
    }
    return OE.sendJob(app, ASTA_JOB.message, slot);
  });
  row.classList.add('oe-asta');
  return row;
}

/* The heading of the other jobs, one place for its words: drawn by jobRows,
   and by OE.onSettings when the Asta tile comes with no other job. */
// WORDING: held for the reader test
const otherJobsHead = () => OE.el('li', { class: 'jobs-head' }, OE.el('h2', {}, 'Other jobs'));

/* The jobs in one column of tiles: the main job's row first (the server
   marks it; the first job when none is marked), then a row with the
   heading "Other jobs", then the rest, and last, while the Settings switch
   is on, the Asta tile (r5-n S3). */
function jobRows(app, jobs, on) {
  const marked = jobs.findIndex((j) => j && j.main === true);
  const at = marked >= 0 ? marked : 0;
  const main = { ...jobs[at], main: true };
  const others = jobs.filter((_, i) => i !== at);
  return [
    jobRow(app, main, on),
    others.length || astaOn ? otherJobsHead() : null,
    ...others.map((job) => jobRow(app, job, on)),
    astaOn ? astaRow(app) : null,
  ];
}

/* r5-n S3: this card is told the switch's state at each read and change of
   its Settings box (common.js OE.settingsBlock), at each read of its own
   (readSettings) and when the Asta tile's press reads it. Only the Asta
   tile is added or removed, and the "Other jobs" heading with it when no
   other job is under it; every other row keeps its button, its press under
   way and its slot (a message to copy stays). Signed out, the words over
   the tiles follow (offWords). Nothing else changes (a sign-in under way
   keeps its wait, the figure stays where it is), and Claude is told
   nothing. */
OE.onSettings = (state) => {
  settingsTold += 1;
  const want = Boolean(state && state.asta && state.asta.on === true);
  if (want === astaOn) return;
  astaOn = want;
  const list = root.querySelector('ul.jobs');
  if (!list || !jobsDrawn) return;
  // With no other job, the heading is there only for the tile (as jobRows draws it).
  const alone = jobsDrawn.jobs.length < 2;
  const row = list.querySelector(':scope > li.oe-asta');
  if (want && !row) {
    if (alone && !list.querySelector(':scope > li.jobs-head')) list.append(otherJobsHead());
    list.append(astaRow(jobsDrawn.app));
  } else if (!want && row) {
    row.remove();
    const head = alone ? list.querySelector(':scope > li.jobs-head') : null;
    if (head) head.remove();
  }
  offWords();
};

/* r5-n (after review): signed out, the card's line and the line over the
   tiles say why the tiles are off. While the Asta tile is shown (it needs
   no sign-in) they say the sign-in is for the Studio jobs
   (START_NEXT_STUDIO, SIGN_IN_STUDIO_JOB); else they are render's own
   words. Set in place at each drawing and when the switch changes; signed
   in, or with no jobs (no tile then), nothing changes. r5-o T2: while the
   tiles are locked the locked words stand instead (lockedWords). */
function offWords() {
  if (lockedWords()) return;
  if (!jobsDrawn || jobsDrawn.on) return;
  const next = root.querySelector(':scope > .oe-lead p.next');
  if (next) next.textContent = astaOn ? START_NEXT_STUDIO : START_LEAD.next;
  const list = root.querySelector('ul.jobs');
  const line = list ? list.previousElementSibling : null;
  if (line) line.textContent = astaOn ? SIGN_IN_STUDIO_JOB : 'Sign in to start a job.';
}

/* r5-o T2 (after review): the card's words while its tiles are locked, set
   in place: at each drawing and at each change of the switch (offWords),
   and at the moment of the lock (the event oe-jobs-locked, OE.lockJobs),
   when the card is not drawn again. The card's line says one job is in the
   chat (START_NEXT_LOCKED; signed out START_NEXT_LOCKED_OUT), and the line over
   the tiles (signed out) is taken away. True when the tiles are locked.
   r5-p J1: the card's line ends with the Choose another job text button
   (OE.chooseAnotherButton), which lifts the lock; a line that already holds
   it keeps that button (and its focus), only its words are set again. */
function lockedWords() {
  if (!OE.jobLocked()) return false;
  if (!jobsDrawn) return true;
  const next = root.querySelector(':scope > .oe-lead p.next');
  if (next) {
    const words = (jobsDrawn.on ? START_NEXT_LOCKED : START_NEXT_LOCKED_OUT) + ' ';
    if (next.querySelector('button.oe-choose-another')) next.firstChild.textContent = words;
    else next.replaceChildren(words, OE.chooseAnotherButton());
  }
  const list = root.querySelector('ul.jobs');
  const line = list ? list.previousElementSibling : null;
  if (line) line.remove();
  return true;
}
/* r5-p J1: the lock lifted (Choose another job, OE.unlockJobs): the card's
   line and the line over the tiles are as a drawing with no lock has them,
   for the card as it is now (signed in or out; the Asta tile shown or not:
   offWords), so a sign-in or a turn of the switch made while the tiles were
   locked is not undone. The Choose another job button went with the locked
   line, so the focus goes to the first job that can be pressed (signed out
   with no Asta tile every tile is disabled: then to the card's one
   contained button, the sign-in's), only while this panel's frame has it. */
function unlockedWords() {
  if (!jobsDrawn) return;
  const next = root.querySelector(':scope > .oe-lead p.next');
  if (next) next.textContent = jobsDrawn.on ? START_NEXT_IN : START_LEAD.next;
  const list = root.querySelector('ul.jobs');
  // Signed out, the line over the tiles the lock took away stands there again, as render makes it; offWords sets its words.
  if (list && !jobsDrawn.on && !list.previousElementSibling) list.before(OE.el('div', {}, ''));
  offWords();
  OE.focusIfHere(root.querySelector('.jobs button.job:not(:disabled)') || root.querySelector('button.primary:not(:disabled)'));
}
document.addEventListener('oe-jobs-unlocked', unlockedWords);
OE.cleanups.add(() => document.removeEventListener('oe-jobs-unlocked', unlockedWords));
document.addEventListener('oe-jobs-locked', lockedWords);
// When Claude closes the card, the listener goes too (OE.start's teardown runs OE.cleanups).
OE.cleanups.add(() => document.removeEventListener('oe-jobs-locked', lockedWords));

/* The switch as the server holds it now (olmoearth_app_settings: quiet and
   read-only, it tells Claude nothing), read by this card itself (r5-n,
   after review): once when it opens, since a card reopened from the history
   drew its tool's old view data, and again each time its panel is shown or
   takes the focus (onShown), since the switch may have been turned in
   another card's box. An answer that comes after a newer state (the box's,
   the tool's) draws nothing; a read that fails leaves the card as it is. */
async function readSettings(app) {
  const seen = settingsTold;
  let state = null;
  try { state = await OE.call(app, 'olmoearth_app_settings'); } catch (_) { return; }
  if (seen === settingsTold && state && typeof state === 'object') OE.onSettings(state);
}
let settingsApp = null;  // the app, once the tool's result came
const onShown = () => {
  if (settingsApp && document.visibilityState === 'visible') readSettings(settingsApp);
};
document.addEventListener('visibilitychange', onShown);
window.addEventListener('focus', onShown);
// When Claude closes the card, the listeners go too (OE.start's teardown runs OE.cleanups).
OE.cleanups.add(() => {
  document.removeEventListener('visibilitychange', onShown);
  window.removeEventListener('focus', onShown);
});

/* The overview figure (OE.overview.figure, a role=img element) and, under
   it and outside it, its one small caption with the docs link after the
   words (OE.docsLink: a text button, and the slot that shows the address
   when the host does not open it), all three in one white box (r5-e S3:
   .oe-overview-wrap). The same signed in and signed out. The
   caption's words are two spans, one shown at a time (r5-d R04, overview.js
   STYLE): the docs figure's (cap-wide) from 680 px up, the narrow strip's
   (cap-narrow) below, so the caption says what is shown. */
function overviewBlock(app) {
  const [docs, address] = OE.docsLink(app);
  return OE.el('div', { class: 'oe-overview-wrap' },
    OE.overview.figure(),
    OE.el('div', { class: 'small muted oe-overview-cap' },
      OE.el('span', { class: 'cap-wide' }, OE.overview.CAPTION),
      OE.el('span', { class: 'cap-narrow' }, OE.overview.CAPTION_NARROW), ' ', docs, address));
}

/* Where the overview figure's box stands (r5-k K8, O17; the owner's choice
   of 18 Nov 2026). From the width at which it is the docs figure
   (OE.overview.WIDE), after the jobs: the title, the line, the sign-in while
   signed out (it stays first), the jobs (the main job, then "Other jobs"),
   then the docs figure with its caption and docs link, so the jobs are no
   longer pushed down by a picture. Below that width, where it is the strip
   of three boxes, under the card's line, before the sign-in and the jobs, as
   before. The box itself moves in the page (no CSS order), so what a screen
   reader reads and where Tab goes follow what is seen: at each drawing
   (render) and when the panel's width crosses that width (the listener
   below, one for the page's life). A focus inside the box (the docs link),
   which the move drops, is given back, only while this panel's frame has
   it. */
const wideMedia = window.matchMedia(OE.overview.WIDE);
function placeOverview() {
  const wrap = root.querySelector(':scope > .oe-overview-wrap');
  if (!wrap) return;
  const had = wrap.contains(document.activeElement) ? document.activeElement : null;
  if (wideMedia.matches) {
    if (root.lastElementChild !== wrap) root.append(wrap);
  } else {
    const line = root.querySelector(':scope > .oe-lead') || root.querySelector(':scope > h1');
    if (line && line.nextElementSibling !== wrap) line.after(wrap);
  }
  if (had && document.activeElement !== had) OE.focusIfHere(had);
}
wideMedia.addEventListener('change', placeOverview);
// When Claude closes the card, the listener goes too (r4-k K1: OE.start's teardown runs OE.cleanups).
OE.cleanups.add(() => wideMedia.removeEventListener('change', placeOverview));

/* After Sign out (the top line's button, the user's own press): the card is
   drawn again from the sign-out's result. The button pressed is gone, so
   the focus goes to the card's one contained button: the sign-in's; or,
   when the key the app was installed with is still in effect (the result
   says signed in, and the top line then draws no Sign out, r5-c S01), the
   main job's. Only while this panel's frame has the focus (OE.focusIfHere). */
function signedOut(app, data, result) {
  render(app, { ...data, status: result });
  OE.focusIfHere(root.querySelector('button.primary'));
}

function render(app, data) {
  generation += 1;
  const status = data.status || {};
  const on = signedIn(status);
  const jobs = Array.isArray(data.jobs) ? data.jobs : [];
  // The account in the top line, set at every drawing, signed in or out, so
  // a name never outlasts its sign-in; with the key the app was installed
  // with (its source), no Sign out (r5-c S01).
  OE.setAccount(app, { signedIn: on, account: status.account, source: status.source, onSignOut: (s) => signedOut(app, data, s) });
  root.replaceChildren(OE.el('h1', {}, 'What this app can do'));
  const lead = OE.lead(on ? { ...START_LEAD, next: START_NEXT_IN } : START_LEAD);
  if (lead) root.append(lead);
  root.append(overviewBlock(app));
  // r5-n B3: a key held that Studio could not be asked about: still signed in, the jobs on, one line that says so.
  if (status.studio_unreachable) root.append(OE.el('div', { class: 'card error small' }, OE.STUDIO_UNREACHABLE));
  if (!on) {
    if (status.key_problem) root.append(OE.el('div', { class: 'card error small' }, status.key_problem));
    root.append(OE.signInPanel(app, {
      acceptCurrent: true,  // a sign-in made in another panel counts here
      // The note's two lines: the key, then Request access (r5-g G2).
      note: [KEY_NOTE, accessLine(app)],
      onDone: (s) => {
        render(app, { ...data, status: s });
        // The user pressed the sign-in's button: the focus goes on to the first job.
        OE.focusIfHere(root.querySelector('.jobs button'));
      },
    }));
  }
  if (!jobs.length) {
    jobsDrawn = null;
    root.append(OE.el('div', { class: 'faint' }, 'Ask Claude what this app can do.'));
    placeOverview();
    return;
  }
  jobsDrawn = { app, jobs, on };
  // Why the tiles are off stands over them, inside the jobs card, not loose under the last tile's box (r5-e R2),
  // at body size in the body colour (r5-i B8: small and grey, it was the only word that the tiles are off).
  root.append(OE.el('section', { class: 'card stack' },
    on ? null : OE.el('div', {}, 'Sign in to start a job.'),
    OE.el('ul', { class: 'items jobs', 'aria-label': 'Jobs' }, jobRows(app, jobs, on))));
  offWords();
  // r5-k K8: on a wide panel the docs figure goes after the jobs; on a narrow one the strip stays under the line.
  placeOverview();
}

/* What the top line draws for a status (OE.setAccount): null signed out;
   signed in, its words (whose account, or the app's own key, which has no
   Sign out: r5-c S01) and the account its spoken name gives. */
const drawnAs = (s) => (signedIn(s)
  ? OE.accountShort(s.account, s.source) + '|' + OE.accountShort(s.account) : null);

/* Once, when the card opens: whether the user signed in or out, or another key
   or account is now in effect, since the tool ran (a card reopened from the
   history). It moves no focus; when it fails, the card stays as drawn. */
async function recheck(app, data) {
  const mine = generation;
  let now = null;
  try { now = await OE.call(app, 'olmoearth_app_status'); } catch (err) { return; }
  if (mine !== generation || !now) return;
  if (drawnAs(now) !== drawnAs(data.status)) render(app, { ...data, status: now });
}

await OE.start('olmoearth-start', {
  onResult: (params, app) => {
    const data = OE.viewData(params);
    // r5-n S3: the Settings switch as the server read it when the tool ran,
    // then as it is now (readSettings: a read under way from before is dropped).
    astaOn = data.asta === true;
    settingsTold += 1;
    settingsApp = app;
    render(app, data);
    recheck(app, data);
    readSettings(app);
  },
});
</script>
</body>
</html>
