}

/* The card's model of one zone (check.offer_zones). kind: 'pick' (counts
   offered, none picked until the user picks one), 'retry' (a failed draw the
   press retries with the count its first press pinned), 'drawn', 'busy',
   'failed' (not drawn again here), 'refused' (no count offered), 'later'
   (an editor is open here, so the press is not shown) or 'unknown' (its
   press got no answer back, so it may be drawn: not pressed again here).
   name is the zone's (what Claude is told); part the server's part name;
   index its place among the card's zones (0-based); failedAt when its draw
   failed (failedAtOf), which orders the retries only. */
function zoneModel(z, index) {
  const offer = (Array.isArray(z.offer) ? z.offer : [])
    .filter((o) => o && Number.isInteger(o.labels) && o.labels > 0 && typeof o.sentence === 'string');
  const m = {
    key: typeof z.check_key === 'string' ? z.check_key : null, index,
    name: String(z.zone || z.file || 'This zone'), zone: typeof z.zone === 'string' ? z.zone : null,
    part: typeof z.part === 'string' && z.part ? z.part : null,
    file: z.file, share: z.share, shareValue: Number.isFinite(z.share_value) ? z.share_value : null,
    windows: z.n_valid, square: z.square && typeof z.square === 'object' ? z.square : null,
    offer, pick: null, kind: 'refused', draw: null, error: null, budget: null, failedAt: null,
    refused: z.refused, refusedAt: z.refused_at, changed: Boolean(z.raster_changed), changedText: null,
    // The server's line on pixels set into 0 to 1 (a score map, r5-a K2), for Details; else null.
    clipped: typeof z.clipped === 'string' && z.clipped ? z.clipped : null,
    // sheetError: true once its sheet did not open on a press (the face's red line: fillZone, r5-i B1); sheetWhy:
    // the reason, for Details (F04).
    line: null, fresh: false, repeat: false, sheetError: null, sheetWhy: null, opening: false, reads: 0,
    body: null, heading: null, openButton: null, progressEl: null, group: null,
    // named: the open button's label a line of the part names (r5-i B1: SHEET_TRY, SHEET_NOT_OPENED), else null.
    named: null,
  };
  if (z.state === 'drawn' && z.draw && typeof z.draw.labels_csv_path === 'string' && z.draw.labels_csv_path) {
    m.kind = 'drawn';
    m.draw = { ...z.draw };
  } else if (z.state === 'drawn') {
    m.kind = 'failed';
    m.error = 'the draw names no sheet';
  } else if (z.state === 'busy') {
    m.kind = 'busy';
  } else if (z.state === 'failed') {
    m.error = z.error;
    m.budget = Number.isInteger(z.budget) ? z.budget : null;
    m.failedAt = failedAtOf(z.failed_at);
    m.kind = z.retry && m.budget !== null && !m.changed && m.key ? 'retry' : 'failed';
  } else if (offer.length && m.key) {
    m.kind = 'pick';
  }
  return m;
}

/* A drawn zone's record from the press's answer (check.draw_view); the
   sheet's progress words and counts come from a read of its counts. */
function drawOf(a, old) {
  return {
    pressed_at: a.pressed_at, budget: a.budget, design: a.design, seed: a.seed,
    labels_csv_path: a.labels_csv_path,
    must_state: Array.isArray(a.must_state) ? a.must_state : [],
    progress: old ? old.progress : null, open_label: old ? old.open_label : null,
    n_rows: old ? old.n_rows : null, n_labelled: old ? old.n_labelled : null,
  };
}

/* The card's labelling rule (the view data's rule): set (the owner's, or one
   a part of this map pinned), or not set, and then the gate asks for one.
   replaceable: the owner's rule with no part of the map drawn, so the box
   for the map's own rule shows beside it (missing: no box). */
function ruleModel(rule) {
  const r = rule && typeof rule === 'object' ? rule : {};
  const source = r.source === 'owner' || r.source === 'typed' ? r.source : null;
  return {
    set: r.set !== false,
    text: typeof r.text === 'string' && r.text ? r.text : null,
    source,
    scope: typeof r.scope === 'string' && r.scope ? r.scope : null,
    replaceable: source === 'owner' && r.replaceable === true,
  };
}

/* The example pictures the server sends beside the owner's rule (the view
   data's examples, r4-k K9: {present, absent, year}, only when the rule is
   the owner's and the app ships both pictures): two PNG data URLs and the
   year of their Sentinel data, else null (nothing shown, no place line). */
const EXAMPLE_PNG = /^data:image\/png;base64,[A-Za-z0-9+/]+={0,2}$/;
function examplesOf(e) {
  if (!e || typeof e !== 'object') return null;
  const year = Number.isInteger(e.year) && e.year >= 2014 && e.year <= 2100 ? e.year : null;
  if (year === null || typeof e.present !== 'string' || typeof e.absent !== 'string') return null;
  if (!EXAMPLE_PNG.test(e.present) || !EXAMPLE_PNG.test(e.absent)) return null;
  return { present: e.present, absent: e.absent, year };
}

/* The two example pictures side by side, each over its caption (the
   caption is the picture's alt text, so a screen reader says it once).
   r5-l L2: under them, in the same block, one small line on where they come
   from (EXAMPLES_SOURCE), so it is read with the pictures and goes with
   them. */
function examplesBlock(ex) {
  const one = (src, caption) => OE.el('figure', {},
    OE.el('img', { src, alt: caption }),
    OE.el('figcaption', { class: 'small', 'aria-hidden': 'true' }, caption));
  return OE.el('div', { class: 'oe-examples-set' },
    OE.el('div', { class: 'oe-examples' }, one(ex.present, EXAMPLE_PRESENT), one(ex.absent, EXAMPLE_ABSENT)),
    OE.el('div', { class: 'small muted oe-examples-from' }, EXAMPLES_SOURCE));
}

/* The card for the zones of one result: the title and the steps, the gate,
   what each part shows, the parts, the one press, the editor of the part
   opened here, and the fold. */
function checkCard(app, data, zones, must, resultId = null, drawsMax = DRAWS_MAX) {
  const models = zones.map((z, i) => zoneModel(z, i));
  const nParts = models.length;
  /* Whether each part is a strip of its own (r5-e K3): every part's file is
     one of Studio's strip files (as the server's check._utm reads a name:
     result_epsg<code>_<i>_native.tif with a code from 32601 to 32660, north,
     or 32701 to 32760, south; the strip is the code's last two digits) and
     no strip comes twice. Only then are the strips picture and its sentence
     true. One strip on both sides of the equator (two parts in one strip of
     the picture), a file that is no strip, or a strip saved twice gets the
     plain line. Read from the file's name, never from the zone's label. */
  const stripOf = (m) => {
    const f = /^result_epsg(\d+)_\d+_native\.tif$/.exec(String(m.file || ''));
    const c = f ? Number(f[1]) : 0;
    return (c >= 32601 && c <= 32660) || (c >= 32701 && c <= 32760) ? c % 100 : null;
  };
  const byStrip = models.every((m) => stripOf(m) !== null) && new Set(models.map(stripOf)).size === nParts;
  // A part's name on the face: the server's, else "Part i" (r4-h V6), never the zone's.
  const label = (m) => m.part || PART_N(m.index + 1);
  const cardNotes = new Set(must.filter((s) => typeof s === 'string'));
  const resolved = typeof data.resolved === 'string' && data.resolved ? data.resolved : null;
  /* r5-h H2: the server's one line when the map was read from this
     computer's copy of Studio's files (server.CHECK_COPY_LINE), said once,
     in Details; null when the files were downloaded now. */
  // WORDING: r5h (the server's words, shown whole)
  const copyLine = typeof data.read_from_copy === 'string' && data.read_from_copy ? data.read_from_copy : null;
  /* A score map's cut (r5-a K3): the server's one line (server.CHECK_CUT_LINE),
     read only, right over the gate whatever the gate shows; null for any other map. */
  // WORDING: r5a K3 (the server's words, shown whole)
  const cut = typeof data.cut === 'string' && data.cut ? data.cut : null;
  /* The map's rule as the server gives it: the view's, then each press
     reply's (r4-h Q4, Q11), never worked out here. ruleLost: a press got no
     reply, so the card cannot say the rule (no rule and no box shown, one
     line, RULE_LOST, in their place: r4-i F6) and picks nothing more (r5-b
     J09: no part offers a number then, so no press shows). */
  let rule = ruleModel(data.rule);
  let ruleLost = false;
  /* The example pictures (r4-k K9): shown, and their place line in Details,
     only while the card shows the owner's rule (never beside a typed rule,
     nor after a press with no reply). */
  const examples = examplesOf(data.examples);
  const examplesShown = () => Boolean(examples) && !ruleLost && rule.set && rule.source === 'owner'
    && Boolean(rule.text);
  let opened = null;  // the zone whose sheet the editor here shows
  let busy = false;  // a press is being answered (the press is aria-disabled, keeping the focus)
  let primary = null;  // the drawn zone whose open button is the contained one, if any
  /* 'ask' (the rule's input), 'shown' (a typed rule, read only), 'replace'
     (the owner's rule with the box for the map's own), 'owner' (the owner's
     rule, read only) or 'none'. */
  let gateMode = 'none';

  const press = OE.el('button', {
    class: 'primary', 'aria-disabled': 'true', 'aria-describedby': 'oe-check-limit oe-check-cannot',
    onclick: () => drawPicked(),
  }, PRESS);
  /* Under the press: past the most parts one press draws, how many to unpick
     or which failed picks wait (limitWords, small); within it, why the press
     is off or which parts it leaves out (pressWhy, in body type: r5-b J08).
     The press is described by it (aria-describedby). */
  const limitLine = OE.el('div', { class: 'small error', id: 'oe-check-limit', hidden: true });
  /* The line over the press, the press and the line under it (the come-back
     line of r5-a L4 is in Details since r5-e K4). */
  const pressArea = OE.el('div', { class: 'stack' },
    OE.el('div', { id: 'oe-check-cannot' }, CANNOT),
    OE.el('div', { class: 'row' }, press),
    limitLine);
  // Holds the press, or the editor of the zone opened here.
  const action = OE.el('div', { class: 'stack' });
  // The heading over the parts: the question, or what the card holds once no part offers a number (fillAsk).
  const ask = OE.el('p', { class: 'ask' }, ASK);
  // Under the question, once for every part (r5-e K1): what more squares give; hidden by fillAsk unless a
  // part offers more than one number.
  const moreLine = OE.el('div', { id: 'oe-check-more' }, MORE_WORK);
  // The gate: the rule's input, a typed rule read only, or the owner's rule
  // (with the box for the map's own while no part is drawn), in one white
  // card (r5-e K5: the rule, its scope, its example pictures and the box with
  // its line under it are one item).
  const gate = OE.el('div', { class: 'gate card stack', hidden: true });
  // The box: described by the small line under it (r5-b J18), which is in the page whenever the box is.
  const ruleInput = OE.el('input', {
    type: 'text', id: 'oe-rule', maxlength: String(RULE_MAX), autocomplete: 'off', spellcheck: 'true',
    'aria-describedby': 'oe-rule-note', oninput: () => updatePress(),
  });
  const foldBody = OE.el('div', { class: 'stack' });
  const drawable = () => models.filter((m) => m.kind === 'pick' || m.kind === 'retry');
  /* The rule as the server keeps it (sheet.clean_rule): format characters
     (a zero-width space, a soft hyphen) dropped, each run of spaces, tabs or
     other white space one space, the ends trimmed; counted in code points,
     as the server counts characters, never in UTF-16 units. */
  const ruleText = () => ruleInput.value.replace(/\p{Cf}/gu, '').replace(/\s+/g, ' ').trim();
  const ruleLength = () => [...ruleText()].length;
  /* Off after a press that got no reply (ruleLost: the card cannot say the
     rule, so no part is drawn under a rule the user does not see; r4-i F6),
     while the gate's rule is too short, or while the box holds a rule too
     short to send (an empty box keeps the owner's rule). */
  const gateHeld = () => ruleLost || (gateMode === 'ask' && ruleLength() < RULE_MIN)
    || (gateMode === 'replace' && ruleLength() > 0 && ruleLength() < RULE_MIN);
  /* The rule the press sends: the gate's, or the box's when it holds one;
     else none (the owner's rule, or one a part pinned, on the server). */
  const ruleSent = () => (gateMode === 'ask' || (gateMode === 'replace' && ruleLength() > 0)
    ? ruleText() : null);

  /* What a press sends, in the card's order: the failed draws it retries
     first, at most drawsMax (a retry has no count to unpick), then the
     counts picked, up to the room left; with how many failed draws it
     retries, how many more wait past drawsMax, how many picks are past the
     room (to unpick: the press is off while any is) and the room. Past
     drawsMax the failed draws that have waited longest go (r4-l L2): the
     earliest failedAt first, one with no time before any, ties in the
     card's order; each answer's own failedAt (takeAnswer) puts a draw that
     fails again behind those that waited, so every failed pick gets its
     turn, never the same first drawsMax again and again. */
  function sendPlan() {
    const waitedLonger = (a, b) => (a.failedAt === b.failedAt ? a.index - b.index
      : a.failedAt === null ? -1 : b.failedAt === null ? 1 : a.failedAt < b.failedAt ? -1 : 1);
    const retries = models.filter((m) => m.kind === 'retry').sort(waitedLonger);
    const picks = models.filter((m) => m.kind === 'pick' && m.pick !== null);
    const retrying = retries.slice(0, drawsMax);
    const room = drawsMax - retrying.length;
    const chosen = new Set([...retrying, ...picks.slice(0, room)]);
    return {
      send: models.filter((m) => chosen.has(m)), retrying: retrying.length,
      waiting: retries.length - retrying.length, over: Math.max(0, picks.length - room), room,
    };
  }

  /* The line under the press, by what can be unpicked (a count picked; a
     failed pick to retry cannot be): how many picks to unpick past the
     room, and when the failed picks alone pass drawsMax, that this press
     retries the drawsMax that have waited longest (sendPlan's order, r4-l
     L2; never "the first") and the rest wait. Empty within the limit. */
  // WORDING: squares
  function limitWords({ retrying, waiting, over, room }) {
    const most = 'At most ' + drawsMax + ' parts in one press';
    const retried = waiting
      ? 'the ' + OE.counted(retrying, 'failed pick') + (retrying === 1 ? ' that has' : ' that have') + ' waited longest'
      : OE.counted(retrying, 'failed pick');
    const rest = waiting ? ' ' + OE.counted(waiting, 'more failed pick') + (waiting === 1 ? ' waits' : ' wait')
      + ' for the next press, or for the Check card opened again.' : '';
    if (over <= 0) return waiting ? most + ': this press retries ' + retried + '.' + rest : '';
    return most + (retrying ? ', and this press retries ' + retried : '') + ': unpick ' + OE.counted(over, 'part')
      + (room > 0 ? ', pick the others, then open the Check card again for the rest.'
        : ', then open the Check card again for ' + (over === 1 ? 'it.' : 'them.')) + rest;
  }

  /* What the card tells Claude (OE.tellClaude), each time a zone changes:
     the result's id, then each zone by its name, a clause of its own, drawn
     (how far its sheet is labelled first, then its count, design and seed,
     its sheet's name, and its path or that it is open in this card) or not.
     Over the room the update leaves it, the paths of the zones not open go
     first, then whole zones from the end, which a last clause counts (the
     model's olmoearth_check_map lists them); never a cut inside a clause.
     Never a check's key, a count chosen and not drawn, the map's name, the
     typed rule or any grade; the editor open here tells its own counts
     beside these. */
  function tellCard() {
    const clause = (m, withPath) => {
      if (m.kind === 'drawn' && m.draw) {
        const d = m.draw;
        const name = sheetName(d);
        const counts = d.progress ? bare(d.progress) : 'its counts not read yet';
        return m.name + ': ' + counts + ', sample drawn (' + settings(d) + '), label sheet ' + name
          + (opened === m ? ' open in this card' : withPath ? ' (labels_csv_path ' + d.labels_csv_path + ')' : '');
      }
      const state = m.kind === 'busy' ? 'being drawn in another window'
        : m.kind === 'failed' || m.kind === 'retry' ? 'its draw failed'
          : m.kind === 'unknown' ? 'its press had no reply, so it may be drawn'
            : m.kind === 'refused' ? 'no count offered here' : 'not drawn';
      return m.name + ': ' + state;
    };
    const full = models.map((m) => clause(m, true));
    const short = models.map((m) => clause(m, false));
    const head = 'Check card' + (resultId ? ' of Studio result_id ' + OE.ctxId(resultId) : '')
      + ' (' + OE.counted(models.length, 'zone') + ', each its own map): ';
    const more = (k) => OE.counted(k, 'more zone') + ' not listed (olmoearth_check_map lists them)';
    OE.tellClaude(app, (room) => {
      const whole = head + full.join('; ') + '.';
      return whole.length <= room ? whole : OE.fitClauses(head, short, '.', room, more);
    });
  }

  /* The gate: while no rule is set and a part can still be picked, the
     rule's ask and input (the press stays off under RULE_MIN characters)
     under a label in body type, and under the input a small line with an
     example (r5-b J18; never sent: ruleText reads the value, and the input
     has no grey hint); a rule a part of this map pinned, read only with its
     scope; the owner's rule on the face with its scope, and beside it, while
     no part of the map is drawn and a part can still be picked, the box for
     the map's own rule under a label in body type, and under it a small line
     on what an empty box does (the owner's rule is used; 1 to RULE_MIN - 1
     characters hold the press); once a part is
     drawn, the owner's rule read only; after a press with no reply (mode
     'lost'), one line, RULE_LOST, and no rule and no box (ruleLost: nothing
     more is picked until a reopened card gives the rule; r4-i F6, r5-b J09).
     Under the owner's rule (read only, or with the box), the two example
     pictures when the server sent them (r4-k K9), before the box.
     Rules are text, never markup. Drawn again only when its mode changes
     (or the server's rule came with a reply: gateMode reset), so the words
     typed and the focus stay. */
  function fillGate() {
    const owner = rule.set && rule.source === 'owner' && rule.text;
    const mode = ruleLost ? 'lost'
      : !rule.set && drawable().length ? 'ask'
        : rule.set && rule.source === 'typed' && rule.text ? 'shown'
          : owner && rule.replaceable && drawable().length ? 'replace'
            : owner ? 'owner' : 'none';
    if (mode === gateMode) return;
    gateMode = mode;
    // The rule and its scope; under the owner's rule, its two example
    // pictures when the server sent them (r4-k K9), before the box.
    const ruleLines = () => [
      OE.el('div', {}, RULE_SHOWN(rule.text)),
      rule.scope ? OE.el('div', { class: 'small muted' }, rule.scope) : null,
      examplesShown() ? examplesBlock(examples) : null,
    ].filter(Boolean);
    // The box under its label in body type, and under the box a small line
    // that describes it (r5-b J18): the gate's example, or what an empty box does.
    const boxed = (words, under) => OE.el('div', {},
      OE.el('label', { class: 'own-rule', for: 'oe-rule' }, words), ruleInput,
      OE.el('div', { class: 'small muted under-box', id: 'oe-rule-note' }, under));
    if (mode === 'ask') {
      gate.replaceChildren(OE.el('div', {}, RULE_ASK), boxed(RULE_LABEL, RULE_HINT));
    } else if (mode === 'replace') {
      gate.replaceChildren(...ruleLines(), boxed(RULE_OWN, RULE_EMPTY));
    } else if (mode === 'shown' || mode === 'owner') {
      gate.replaceChildren(...ruleLines());
    } else if (mode === 'lost') {
      gate.replaceChildren(OE.el('div', {}, RULE_LOST));
    } else {
      gate.replaceChildren();
    }
    gate.hidden = mode === 'none';
  }

  /* Under the press, within the most parts one press draws (r5-b J08): why
     the press is off (a part's sheet is being opened, SHEET_OPENING, r5-n
     JS-2; the gate asks for a rule and neither it nor a number
     is there; the box beside the app's rule holds too few characters, which
     BOX_SHORT says, or the gate's rule does; no number is chosen),
     or, on a map in parts, which parts that still offer numbers this press
     leaves out (LEFT_OUT). Empty when the press takes every such part. */
  function pressWhy(plan) {
    if (ruleLost) return '';
    if (models.some((x) => x.opening)) return SHEET_OPENING;
    const chosen = plan.send.length > 0;
    if (gateMode === 'ask' && ruleLength() < RULE_MIN && !chosen) return RULE_AND_NUMBER;
    if (gateMode === 'replace' && gateHeld()) return BOX_SHORT;
    if (gateHeld()) return RULE_FIRST;
    if (!chosen) return CHOOSE;
    const left = nParts > 1 ? models.filter((m) => m.kind === 'pick' && m.pick === null).map(label) : [];
    return left.length ? LEFT_OUT(left) : '';
  }

  /* The press: whether a count is picked, whether it shows, and the line
     under it: past the most parts one press draws, limitWords (small; red
     while picks are past the room); within it, pressWhy, in body type (r5-b
     J08), which clears itself, since every choice and every key in the box
     runs this. The press is off while picks are past the room, nothing is
     chosen or the gate's rule is too short, and while a part's sheet is
     being opened (r5-n JS-2: openZone); on when only failed picks wait. */
  function updatePress() {
    const can = drawable();
    if (opened !== null || !can.length) {
      if (pressArea.isConnected) pressArea.remove();
      return;
    }
    const plan = sendPlan();
    const words = limitWords(plan);
    const why = words ? '' : pressWhy(plan);
    limitLine.hidden = !words && !why;
    limitLine.className = words ? 'small ' + (plan.over > 0 ? 'error' : 'muted') : '';
    limitLine.textContent = words || why;
    press.setAttribute('aria-disabled', String(busy || models.some((x) => x.opening) || !plan.send.length || plan.over > 0 || gateHeld()));
    if (!pressArea.isConnected) action.replaceChildren(pressArea);
  }

  /* One part's counts: a group of buttons, each the count in bold and no
     words (no drawing: r4-h C1; r5-e K1: what more squares give is one line
     under the question, MORE_WORK), every button as wide and as tall as the
     others (the group is .oe-same). None pressed until the user presses
     one; a second press unpicks it. */
  function countsBlock(m) {
    const buttons = m.offer.map((o) => {
      const b = OE.el('button', { type: 'button', class: 'pick', 'aria-pressed': String(m.pick === o.labels) },
        OE.el('span', { class: 'pick-count' }, OE.el('strong', {}, Number(o.labels).toLocaleString('en-US')),
          o.labels === 1 ? ' square' : ' squares'));
      b.addEventListener('click', () => {
        const clear = b.getAttribute('aria-pressed') === 'true';
        buttons.forEach((other) => other.setAttribute('aria-pressed', String(!clear && other === b)));
        m.pick = clear ? null : o.labels;
        updatePress();
      });
      return b;
    });
    m.group = OE.el('div', { class: 'pick-group oe-same', role: 'group',
      'aria-label': SQUARES_GROUP(nParts > 1 ? label(m) : null) }, buttons);
    return m.group;
  }

  /* What a part shows now, drawn again after a press or an editor opens. */
  function fillZone(m) {
    const parts = [];
    m.openButton = null;
    m.progressEl = null;
    m.group = null;
    m.named = null;
    if (m.kind === 'pick') {
      parts.push(countsBlock(m));
    } else if (m.kind === 'retry') {
      // One line (r5-e K8): the short red words, then that the press tries it again (RETRY, r5-f F11: the press
      // by its button's words), or, when more picks failed than one press takes and this one waits (sendPlan),
      // that it is not in this press and waits for a later one (RETRY_LATER); the reason is in Details. Which
      // picks a press retries changes only with a press's answer or an opened sheet, each followed by renderAll.
      const now = sendPlan().send.includes(m);
      parts.push(OE.el('div', {}, OE.el('span', { class: 'error' }, FAILED_SHORT), ' ',
        now ? RETRY(m.budget) : RETRY_LATER(m.budget)));
    } else if (m.kind === 'drawn') {
      const d = m.draw;
      const head = m.repeat ? REPEATED(d.budget, dayText(d.pressed_at)) : PICKED(d.budget, dayText(d.pressed_at));
      m.progressEl = OE.el('span', {}, d.progress ? ' ' + bare(d.progress) + '.' : '');
      parts.push(OE.el('div', {}, OE.el('span', {}, head), m.progressEl));
      // A sheet that cannot be read now (r5-f F04): what to do, in body type, the part by its name on a map in
      // parts; the server's reason (it may name the sheet's file) is in Details (fillFold). When a press of its
      // button failed too, that one line turns red, so the press visibly got its answer, and SHEET_NOT_OPENED is
      // not drawn beside it: the sheet failed twice (the card's read, the press), so the line stays the one that
      // says to tell Claude, not one that says to press again. r5-i B1: before any press the line says to press
      // the button, by the label drawn on it below (SHEET_TRY), in body type; SHEET_UNREAD, red, only after a
      // press failed. The red line of a press that failed names the button by that same label (SHEET_NOT_OPENED);
      // a read of the counts that changes the label draws the part again (refreshZone, m.named).
      const button = d.open_label || 'Open the sheet';
      const unread = Boolean(d.sheet_error) && !d.progress;
      if (unread) {
        parts.push(m.sheetError ? OE.el('div', { class: 'error' }, SHEET_UNREAD(nParts > 1 ? label(m) : null))
          : OE.el('div', {}, SHEET_TRY(nParts > 1 ? label(m) : null, button)));
      }
      if (m.changed) parts.push(OE.el('div', { class: 'error' }, m.changedText || CHANGED));
      if (m.sheetError && !unread) parts.push(OE.el('div', { class: 'error' }, SHEET_NOT_OPENED(button)));
      // The label one of those two lines names (SHEET_TRY or SHEET_NOT_OPENED), for refreshZone (r5-i B1).
      m.named = (unread && !m.sheetError) || (!unread && m.sheetError) ? button : null;
      if (opened === m) {
        parts.push(OE.el('div', { class: 'small muted' }, OPEN_HERE));
      } else {
        m.openButton = OE.el('button', { class: primary === m ? 'primary' : '', onclick: () => openZone(m) },
          button);
        // r5-i B1, after review: a part drawn again while a press is answered or its sheet opens (a read of the
        // counts, refreshZone) keeps its button off, as the press and openZone set it; both clear before renderAll.
        if (busy || m.opening) m.openButton.setAttribute('aria-disabled', 'true');
        parts.push(OE.el('div', { class: 'row' }, m.openButton));
      }
    } else if (m.kind === 'busy') {
      parts.push(OE.el('div', {}, BUSY));
    } else if (m.kind === 'failed') {
      if (m.error) parts.push(OE.el('div', { class: 'error' }, FAILED_SHORT));
      parts.push(OE.el('div', {}, m.changed ? (m.changedText || CHANGED) : FINAL));
    } else if (m.kind === 'later') {
      // After a press with no reply the gate's RULE_LOST says what to do (r5-e K8).
      parts.push(OE.el('div', {}, ruleLost ? NOT_YET : LATER));
    } else if (m.kind === 'unknown') {
      parts.push(OE.el('div', {}, NO_ANSWER));
    } else if (m.refusedAt === 'plan') {
      parts.push(OE.el('div', {}, NO_COUNT));
    } else if (m.refusedAt === 'read') {
      // r5-i B3: plain words on the face; the server's reason is in Details (fillFold).
      parts.push(OE.el('div', {}, NOT_READ_FACE));
    } else {
      parts.push(OE.el('div', {}, NO_COUNT));
    }
    if (m.line) parts.push(OE.el('div', { class: 'error' }, m.line));
    m.body.replaceChildren(...parts);
  }

  /* The heading over the parts (r5-b J17): the question while a part still
     offers a number or a retry; once none does, that every square is
     answered and how to get the result, when no sheet is open here, a part
     is picked, every picked part's counts say it is answered whole and no
     part may still be picked elsewhere (pressed with no reply, being picked,
     or left for a later card); any other way, "Your squares". The press in
     each part's sheet, one result per part (ALL_ANSWERED, r5-i B2, r5-j
     B3), when more than one part has a sheet, "Open the sheet" when one
     does, on a map in parts too whose other
     parts cannot be checked or failed for good (no sheet, no button). The
     line under it on what more squares give (r5-e K1) shows only while a
     part offers more than one number. */
  function fillAsk() {
    const drawn = models.filter((m) => m.kind === 'drawn');
    const pending = models.some((m) => m.kind === 'unknown' || m.kind === 'busy' || m.kind === 'later');
    const done = opened === null && drawn.length > 0 && !pending && drawn.every((m) => complete(m.draw));
    ask.textContent = drawable().length ? ASK : done ? ALL_ANSWERED(drawn.length > 1) : YOUR_SQUARES;
    // r5-m, after review: a drawn sheet that already gave its result (its counts' graded mark, draw.graded) has no
    // button "Estimate the error rate" (the sheet track's B5): the heading names the one it has, when every drawn
    // sheet gave one and none changed since (draw.graded_changed), or none (ALL_GRADED).
    const graded = drawn.filter((m) => m.draw && m.draw.graded === true);
    const named = graded.length === drawn.length && !graded.some((m) => m.draw.graded_changed === true);
    if (!drawable().length && done && graded.length) ask.textContent = ALL_GRADED(drawn.length > 1, named);
    moreLine.hidden = !models.some((m) => m.kind === 'pick' && m.offer.length > 1);
  }

  /* Details: the parts' files, zones, sizes and the planner's sentences, how
     the pick is fixed, the rare-feature note, the pictures' limit while the
     map's rule is not the owner's (r4-h C4: moved from the gate), where the
     example pictures beside the owner's rule are from while they show (r4-k
     K9), the raw scores, the resolved result and the notes the tool and the
     plans gave (the labelling rule is on the face, fillGate). r5-e: a failed
     pick's reason in the server's words (K8) and what a second press does for
     a user who comes back (K4), the latter only while the card has a press
     and shows no part as picked or as pressed with no reply (r5-a L4's rule).
     r5-f F04: why a picked part's sheet cannot be read now, or did not open
     on a press, in the server's words (the face says only what to do). */
  function fillFold() {
    const nodes = [];
    if (nParts > 1) nodes.push(OE.el('p', {}, SEVERAL(nParts)));
    for (const m of models) {
      const lines = [];
      if (nParts > 1) lines.push(OE.el('div', { class: 'fold-head' }, label(m)));
      const meta = PART_META(m);
      if (meta) lines.push(OE.el('div', {}, meta));
      const size = SQUARE_SIZE(m.square);
      if (size) lines.push(OE.el('div', {}, size));
      // A score map's pixels outside 0 to 1, set to the nearest end (the server's line, r5-a K2).
      if (m.clipped) lines.push(OE.el('div', {}, m.clipped));
      // A failed pick's reason, as the server gave it (r5-e K8: the part's face says only FAILED_SHORT).
      if ((m.kind === 'retry' || m.kind === 'failed') && m.error) {
        lines.push(OE.el('div', {}, PICK_FAILED + bare(m.error) + '.'));
      }
      // Why a picked part's sheet cannot be read now, or did not open on a press, in the server's words (r5-f
      // F04: the part's face says only what to do, SHEET_UNREAD or SHEET_NOT_OPENED). A failed press's reason
      // that says again the one its sheet could not be read for is not said twice; a different one still shows.
      const unreadWhy = m.kind === 'drawn' && m.draw && m.draw.sheet_error && !m.draw.progress
        ? bare(m.draw.sheet_error) : null;
      if (unreadWhy) lines.push(OE.el('div', {}, SHEET_UNREAD_WHY + unreadWhy + '.'));
      if (m.sheetWhy && m.sheetWhy !== unreadWhy) {
        lines.push(OE.el('div', {}, SHEET_NOT_OPENED_WHY + m.sheetWhy + '.'));
      }
      if (m.kind !== 'drawn') {
        m.offer.forEach((o) => lines.push(OE.el('div', {}, OE.counted(o.labels, 'square') + ': ' + o.sentence)));
        [...new Set(m.offer.map((o) => o.rate_note).filter(Boolean).map(String))]
          .forEach((n) => lines.push(OE.el('div', { class: 'small muted' }, n)));
      }
      if (m.refusedAt === 'plan' && m.refused) lines.push(OE.el('div', { class: 'small muted' }, String(m.refused)));
      // r5-i B3: why a part cannot be read as a map, in the server's words (its face says NOT_READ_FACE).
      if (m.refusedAt === 'read' && m.refused) lines.push(OE.el('div', { class: 'small muted' }, NOT_READ + bare(m.refused) + '.'));
      if (m.kind === 'drawn' && m.draw) {
        lines.push(OE.el('div', {}, 'Drawn ' + m.draw.pressed_at + ': ' + settings(m.draw) + '.'));
        const planNotes = (Array.isArray(m.draw.must_state) ? m.draw.must_state : [])
          .filter((s) => typeof s === 'string' && s && !cardNotes.has(s));
        if (planNotes.length) lines.push(notesBlock(planNotes));
      }
      if (lines.length) nodes.push(OE.el('div', { class: 'stack fold-part' }, lines));
    }
    // The come-back line (r5-a L4, in Details since r5-e K4) only while the card has a press and shows no part
    // as picked or as pressed with no reply: beside a picked part the press picks another part's new squares;
    // after a press with no reply, or with every part picked or a sheet open, there is no press.
    const again = drawable().length > 0 && !models.some((m) => m.kind === 'drawn' || m.kind === 'unknown');
    nodes.push(OE.el('p', {}, FIXED));
    if (again) nodes.push(OE.el('p', {}, PICKED_BEFORE));
    nodes.push(OE.el('p', {}, RARE));
    if (!ruleLost && rule.source !== 'owner') nodes.push(OE.el('p', {}, RULE_PICTURES));
    // Where the example pictures beside the owner's rule are from (r4-k K9).
    if (examplesShown()) nodes.push(OE.el('p', {}, EXAMPLES_FROM(examples.year)));
    // Studio's raw scores: a class map's top-k scores (a [0, 1] score map is its score).
    if (data.kind !== 'unit_score') nodes.push(OE.el('p', {}, RAW_SCORES));
    if (resolved) nodes.push(OE.el('div', { class: 'small muted' }, resolved));
    // r5-h H2: read from this computer's copy, with when it was downloaded (the server's line).
    if (copyLine) nodes.push(OE.el('div', { class: 'small muted', id: 'oe-check-copy' }, copyLine));
    if (cardNotes.size) nodes.push(notesBlock([...cardNotes]));
    foldBody.replaceChildren(...nodes);
  }

  /* Every part, the gate, the press and the heading, after a press was
     answered or an editor opened; once a part is drawn, the steps and the
     strips card in their fold (r5-k K6, foldHow). */
  function renderAll() {
    primary = opened === null && !drawable().length ? (models.find((m) => m.kind === 'drawn') || null) : null;
    models.forEach(fillZone);
    fillGate();
    updatePress();
    fillAsk();
    foldHow();
    fillFold();
    tellCard();
  }

  /* Where the focus goes when the control the user pressed has gone and
     nothing else took it: the first open button, else the first part's
     heading, else the card's title. After a press with no reply it goes to
     the gate's line instead (drawPicked): the one line that says what to do. */
  function focusFallback() {
    const withButton = models.find((m) => m.openButton);
    if (withButton) { OE.focusIfHere(withButton.openButton); return; }
    const first = (models[0] && models[0].heading) || title;
    first.setAttribute('tabindex', '-1');
    OE.focusIfHere(first);
  }

  /* A drawn zone's progress words and counts, read again (counts only); an
     older read answered after a newer one is dropped, and a failed read
     changes nothing. The heading follows the counts (a part checked whole);
     the rule is never taken from here (r4-h Q4: the press reply's). A sheet
     that could not be read when the card opened and whose counts read now
     (the user comes back, say, from saving it again as the reason in Details
     says) no longer says it cannot be opened (r5-f F04): its part and Details
     are drawn again, the focus kept on its open button. A press of that
     button that failed is another read, so its line stays. r5-i B1: a line
     that names the open button follows a label these counts changed (the
     part drawn again, the focus kept on the button). */
  async function refreshZone(m) {
    if (!m.draw || !m.draw.labels_csv_path) return;
    const mine = ++m.reads;
    let got = null;
    try {
      got = await OE.call(app, 'olmoearth_app_sheet_progress', { labels_csv_path: m.draw.labels_csv_path });
    } catch (_) { got = null; }
    if (mine !== m.reads || !got || !m.draw) return;
    const unread = Boolean(m.draw.sheet_error) && !m.draw.progress;
    if (typeof got.progress === 'string') m.draw.progress = got.progress;
    if (typeof got.open_label === 'string' && got.open_label) m.draw.open_label = got.open_label;
    if (typeof got.name === 'string' && got.name) m.draw.name = got.name;
    if (Number.isInteger(got.n_rows)) m.draw.n_rows = got.n_rows;
    if (Number.isInteger(got.n_labelled)) m.draw.n_labelled = got.n_labelled;
    // r5-m, after review: whether the sheet gave its result (a graded mark, as sheet.js gaveResult reads it), and
    // whether its answers changed since, for the heading (fillAsk), as check._sheet_words sends them.
    m.draw.graded = Boolean(got.graded && typeof got.graded === 'object');
    m.draw.graded_changed = m.draw.graded && got.graded.changed_since_first === true;
    if (m.progressEl) m.progressEl.textContent = m.draw.progress ? ' ' + bare(m.draw.progress) + '.' : '';
    if (m.openButton) m.openButton.textContent = m.draw.open_label || 'Open the sheet';
    if (unread && typeof got.progress === 'string' && got.progress) {
      const had = Boolean(m.openButton) && document.activeElement === m.openButton;
      m.draw.sheet_error = null;
      fillZone(m);
      fillFold();
      if (had) OE.focusIfHere(m.openButton);
    }
    // r5-i B1: a line of the part that names its open button (m.named) follows a label these counts changed: the
    // part is drawn again, the focus kept on that button.
    if (m.named && m.named !== (m.draw.open_label || 'Open the sheet')) {
      const had = Boolean(m.openButton) && document.activeElement === m.openButton;
      fillZone(m);
      if (had) OE.focusIfHere(m.openButton);
    }
    fillAsk();
    tellCard();
  }

  /* A zone's part of the press's answer (check.draw_view), in the order sent. */
  function takeAnswer(m, a) {
    m.line = null;
    m.fresh = false;
    m.repeat = false;
    if (!a || typeof a !== 'object') { m.line = NOT_PICKED + 'the server gave no answer for this part.'; return; }
    if (a.outcome === 'refused') { m.line = NOT_PICKED + bare(a.error || 'the press was refused') + '.'; return; }
    if (a.outcome === 'busy') { m.kind = 'busy'; return; }
    const drawn = a.state === 'drawn' && typeof a.labels_csv_path === 'string' && a.labels_csv_path;
    if (a.outcome === 'changed') {
      m.changed = true;
      m.changedText = typeof a.error === 'string' && a.error ? a.error : CHANGED;
      if (drawn) { m.kind = 'drawn'; m.draw = drawOf(a, m.draw); } else { m.kind = 'failed'; m.error = null; }
      return;
    }
    if (drawn) {
      m.kind = 'drawn';
      m.draw = drawOf(a, null);
      m.fresh = true;
      m.repeat = a.outcome === 'repeat';
      return;
    }
    if (a.state === 'failed') {
      m.error = a.error;
      if (Number.isInteger(a.budget)) m.budget = a.budget;
      // This failure's time: a retry that failed again waits behind the others (sendPlan).
      m.failedAt = failedAtOf(a.failed_at);
      m.kind = a.retry && m.budget !== null ? 'retry' : 'failed';
      return;
    }
    m.line = NOT_PICKED + 'the answer for this part could not be read.';
  }

  /* The press: pick the parts' squares it sends (sendPlan: the failed picks
     it retries, then the counts picked), once each, in one call of at most
     drawsMax parts, with the gate's rule when it asked for one; then open
     the first part picked, unless a sheet was opened here meanwhile. While
     it is answered the parts' open buttons are off (aria-disabled). A
     refusal of the whole press by the server picked nothing; a call that got
     no answer back may have picked, so its parts are not pressed again here,
     the card shows no rule and no box, only RULE_LOST (ruleLost), and sends
     the user to Claude (the focus, when the press had it, goes to that line,
     the gate's); every other part that still offered numbers, or a
     retry, is left for the card opened again (LATER), so no numbers and no
     grey press stay (r5-b J09; before, the press was held with the gate's
     line as its toast, r4-i F6: that guard stays first in the press). A
     press with nothing chosen, or held by the rule, says why in the line
     under the press (updatePress, r5-b J08); one held by the rule only
     moves the focus to the box (r5-m B3, after review: its toast, right
     under that line since B3, said the same words again, and stayed once
     the rule was fixed). Every
     reply carries the map's rule as the server holds it after
     the press (r4-h Q4, Q11: a rule another card pinned, a claim that
     failed, a typed rule settled), which the card shows from then on; a
     reply that refused a typed rule (a rule already set: refused) picked
     nothing and keeps the picks. No press starts while a part's sheet is
     being opened (r5-n JS-2; openZone and updatePress keep the press
     aria-disabled then): the sheet would open over the press's answer, and
     every part still offering numbers would go to LATER with no press left
     to pick it. */
  async function drawPicked() {
    if (busy || models.some((x) => x.opening)) return;
    if (gateHeld() && ruleLost) { OE.toast(RULE_LOST); return; }
    const plan = sendPlan();
    const picked = plan.send;
    if (!picked.length) { updatePress(); return; }  // the line under the press says what to choose (r5-b J08)
    if (plan.over > 0) { updatePress(); return; }  // the line under the press says how many to unpick
    // The line under the press says what the rule or the box needs (r5-b J08); r5-m B3: no toast repeats it there.
    if (gateHeld()) { updatePress(); OE.focusIfHere(ruleInput); return; }
    const hadFocus = document.activeElement === press;
    const openedAtPress = opened;
    const typed = ruleSent();
    busy = true;
    press.setAttribute('aria-disabled', 'true');
    models.forEach((o) => { if (o.openButton) o.openButton.setAttribute('aria-disabled', 'true'); });
    // WORDING: squares
    OE.toast('Picking the squares...');
    let got;
    try {
      const args = { draws: picked.map((m) => ({ check_key: m.key, budget: m.kind === 'retry' ? m.budget : m.pick })) };
      if (typed !== null) args.reading_rule = typed;
      got = await OE.call(app, 'olmoearth_app_check_draw', args, { timeout: PRESS_WAIT_MS });
    } catch (err) {
      busy = false;
      if (err.fromServer) {
        // WORDING: squares
        OE.toast(NONE_PICKED + bare(err.message || 'the press failed') + '.', true);
      } else {
        picked.forEach((m) => { m.kind = 'unknown'; m.pick = null; m.line = null; });
        ruleLost = true;
        // This card picks nothing more (r5-b J09): a part that still offered numbers, or a retry, reads LATER.
        models.forEach((o) => {
          if (o.kind === 'pick' || o.kind === 'retry') { o.kind = 'later'; o.pick = null; o.line = null; }
        });
        // r5-m B3, after review: no press and no sheet is left under which the status line would sit (it hung
        // under the last part's card, read as that part's line), and the part's line and the gate say it on the
        // face: "Picking the squares..." goes, and a screen reader hears the press's end in the page's hidden status.
        OE.toast('');
        if (heard) heard.textContent = PRESS_NO_ANSWER;
      }
      renderAll();
      // After a press with no reply the gate's line is the one place that says what to do, and it stands
      // before every part: the focus goes to it, so a keyboard or a screen reader lands on the instruction
      // and the panel scrolls to it. A press the server refused whole keeps the press and the focus.
      if (hadFocus && !press.isConnected) {
        if (ruleLost) { gate.setAttribute('tabindex', '-1'); OE.focusIfHere(gate); } else focusFallback();
      }
      return;
    }
    busy = false;
    // The map's rule after this press, as the server gives it: drawn again,
    // and known again after an earlier press that got no reply.
    if (got && got.rule && typeof got.rule === 'object') {
      rule = ruleModel(got.rule);
      ruleLost = false;
      gateMode = '';
    }
    const refused = got && typeof got.refused === 'string' && got.refused ? got.refused : null;
    if (refused) {
      // WORDING: squares
      OE.toast(NONE_PICKED + bare(refused) + '.', true);
      renderAll();
      if (hadFocus && !press.isConnected) focusFallback();
      return;
    }
    const answers = got && Array.isArray(got.draws) ? got.draws : [];
    picked.forEach((m, i) => takeAnswer(m, answers[i]));
    renderAll();
    const drawnNow = picked.filter((m) => m.kind === 'drawn' && m.fresh);
    drawnNow.forEach((m) => refreshZone(m));
    // A part not picked says so on its face; why a pick failed is in Details since r5-e K8, so the toast
    // promises no reason on a part's face.
    // WORDING: r5e
    // WORDING: squares
    OE.toast(drawnNow.length < picked.length ? 'Not every part\'s squares were picked; each part says so.'
      : 'The squares are picked.');
    if (drawnNow.length && opened === openedAtPress) await openZone(drawnNow[0], { hadFocus });
    else if (hadFocus && !press.isConnected) focusFallback();
  }

  /* Open a drawn zone's sheet in the editor here, in place of the press or of
     the editor open before, which first saves what it holds (oeSettle) and
     stays, with its own Save, when that save fails; the heading takes the
     focus if the press or the open button had it. Nothing opens while a
     press is answered, and no press starts while a sheet opens: the press is
     aria-disabled from the start, the line under it saying why
     (SHEET_OPENING; r5-n JS-2: updatePress; drawPicked ignores it then, and
     renderAll, at every end that leaves it on the card, draws it again as
     the counts stand). A sheet that cannot be read keeps the open button and
     says to press it again, and to tell Claude if it fails again; why is in
     Details (r5-f F04). When its sheet could not be read when the card opened
     either, its line that said to press (SHEET_TRY, r5-i B1) gives way to the
     red one that says to tell Claude (SHEET_UNREAD; fillZone), and Details
     says the reason once. An editor that stopped saving (its sheet changed under the
     panel) gives way without a save, and once the other sheet is open its
     part says in its own red line, and one toast in the same words, how
     many of its answers were not saved and what to do (NOT_SAVED_PART, r5-b
     J10; oeUnsaved: a count, never a window); the line goes when that part's
     sheet opens again, and the toast too while it still says those words
     (r5-d R05). With none to count, its own last toast about
     that change goes (oeLeave, r4-l L3). */
  async function openZone(m, { hadFocus = null } = {}) {
    if (busy || m.opening || !m.draw) return;
    const button = m.openButton;
    const had = hadFocus !== null ? hadFocus : Boolean(button) && document.activeElement === button;
    m.opening = true;
    if (button) button.setAttribute('aria-disabled', 'true');
    updatePress();
    const before = opened;
    const current = opened !== null ? action.querySelector('section.sheet') : null;
    if (current && typeof current.oeSettle === 'function' && !(await current.oeSettle())) {
      m.opening = false;
      // The button on the card now (a read of the counts may have drawn the part again meanwhile, r5-i B1), still
      // off while a press that started meanwhile is answered.
      if (m.openButton) m.openButton.setAttribute('aria-disabled', String(busy));
      // r5-m B3, after review: said once, by the sheet in its footer under Save labels, in place of the generic
      // "Press Save labels to try again." after the save's reason (oeSay); that line goes once a save is taken.
      // The status line, which this toast took over before (it held, say, "The squares are picked."), is emptied;
      // it says NOT_SWAPPED only for an editor with no such hook.
      if (typeof current.oeSay === 'function') { OE.toast(''); current.oeSay(NOT_SWAPPED); }
      else OE.toast(NOT_SWAPPED, true);
      return;
    }
    const dropped = current && typeof current.oeUnsaved === 'function' ? current.oeUnsaved() : 0;
    let sheet;
    try {
      sheet = await OE.call(app, 'olmoearth_app_sheet', { labels_csv_path: m.draw.labels_csv_path });
    } catch (err) {
      m.opening = false;
      // The face says what to do; the reason, in the server's words, goes to Details (r5-f F04, fillFold). r5-i
      // B1: fillZone words the red line, naming the open button by the label it draws (SHEET_NOT_OPENED).
      m.sheetError = true;
      m.sheetWhy = bare(err.message || 'it could not be read');
      renderAll();
      if (had) OE.focusIfHere(m.openButton);
      return;
    }
    m.opening = false;
    // The sheet was read, so why it could not be read when the card opened no longer holds (r5-f F04: else its
    // card said "Its sheet cannot be opened now." beside "Its sheet is open below.").
    m.draw.sheet_error = null;
    m.sheetWhy = null;
    m.sheetError = null;
    // Its sheet opens again: the line on answers not saved goes (r5-b J10),
    // and so does the toast that said it in the same words (r5-d R05; the
    // same test as OE.say's clear: any other toast stays). r5-m B3: a sheet
    // opens, so the toast that said the one open before stays open
    // (NOT_SWAPPED, the status line's only for an editor with no oeSay) goes
    // too: it asked to press a Save labels no longer here.
    const bar = document.getElementById('oe-toast');
    if (bar && ((m.line && bar.textContent === m.line) || bar.textContent === NOT_SWAPPED)) OE.toast('');
    m.line = null;
    // Each save the server takes reads this zone's counts again; Full screen
    // (where the host offers it) lays the editor's face out for the mode.
    const editor = OE.sheetEditor(app, sheet, {
      headerAction: OE.fullscreenButton(app, OE.sheetMode), onSaved: () => refreshZone(m),
    });
    opened = m;
    models.forEach((o) => {
      if (o.kind === 'pick' || o.kind === 'retry') { o.kind = 'later'; o.pick = null; o.line = null; }
    });
    OE.disposeEditors(action);  // the editor replaced, saved above, drops its timers and listeners
    action.replaceChildren(editor);
    renderAll();
    if (dropped > 0 && before && before.draw) {
      // The part's own red line (fillZone draws it), and the toast in the same words (r5-b J10).
      before.line = NOT_SAVED_PART(dropped, label(before));
      fillZone(before);
      OE.toast(before.line, true);
    } else if (current && typeof current.oeLeave === 'function') {
      // Nothing dropped: the editor swapped away clears its toast about its sheet having changed (r4-l L3).
      current.oeLeave();
    }
    const heading = editor.querySelector('h1');
    if (heading) heading.setAttribute('tabindex', '-1');
    if (had) OE.focusIfHere(heading);
  }

  // The face: title and map, the steps, the gate, the heading (fillAsk), the
  // line on what more squares give (r5-e K1) and, for a map in parts, the
  // docs' picture of the world in strips with the line that says so, in one
  // card, right under it, before the numbers it explains (r5-b J18, r5-e K3),
  // the parts (each in a card of its own on a map in parts, r5-e K2), the
  // press (or the editor), the status line (r5-m B3), then Details.
  const title = OE.el('h2', {}, TITLE);
  root.append(title);
  const map = data.map && typeof data.map === 'object' ? data.map : {};
  const mapLine = [map.name, map.period_text].filter((s) => typeof s === 'string' && s).join(', ');
  if (mapLine) root.append(OE.el('div', { class: 'small muted' }, mapLine));
  const steps = fig('steps', [firstStep(models), ...STEPS.slice(1)]);
  if (steps) root.append(steps);
  // A score map's cut (r5-a K3): the server's line, read only, right over the gate, whatever the gate shows.
  if (cut) root.append(OE.el('div', { id: 'oe-check-cut' }, cut));
  root.append(gate);
  root.append(ask);
  root.append(moreLine);
  if (nParts > 1 && byStrip) {
    root.append(OE.el('div', { class: 'card oe-strips', id: 'oe-check-parts-line' },
      OE.el('img', { src: STRIPS, alt: '', 'aria-hidden': 'true', width: '360', height: '164' }),
      OE.el('div', {}, PARTS_LINE(nParts))));
  } else if (nParts > 1) {
    // Parts that are not one per strip: the plain line in the same place, no picture (the sentence is untrue there).
    root.append(OE.el('div', { class: 'card', id: 'oe-check-parts-line' }, OE.el('div', {}, PARTS_PLAIN(nParts))));
  }
  for (const m of models) {
    m.heading = nParts > 1 ? OE.el('h3', { id: 'oe-part-' + m.index }, PART_HEAD(label(m), m.windows)) : null;
    m.body = OE.el('div', { class: 'stack' });
    // r5-j B9: on a map in parts each part's section is named by its heading, so a screen reader tells two parts'
    // "Open the sheet" (or "Continue labelling") apart by their part, not only by their place.
    root.append(OE.el('section', {
      class: nParts > 1 ? 'part card stack' : 'part stack',
      'aria-labelledby': nParts > 1 ? 'oe-part-' + m.index : null,
    }, m.heading, m.body));
  }
  root.append(action, OE.fold(DETAILS, foldBody));
  /* r5-m B3 (r5-k K5's rule on this card: a status sits under what caused
     it): the page's one status line (OE.toastRegion, #oe-toast) goes right
     under the press or the sheet open here, before HOW and Details, so a
     line about the press or a swap is read where the press or the sheet is,
     not at the page's foot under two folds. */
  action.after(OE.toastRegion());
  /* r5-k K6 (O22, the owner's choice of 18 Nov 2026): once a part is drawn
     (its squares picked, by a press here or before the card opened), the
     four step panels and the strips card (the docs' picture with its line)
     go, the same nodes, into one closed fold, HOW, right after the status
     line under the press or the sheet open here, and before Details: the
     parts and their sheets come first, and the fold opens to show the same
     panels and picture. Before
     any part is drawn the face is as before. A drawn part stays drawn, so
     nothing comes back out, and the fold is made once, so it stays open
     when the user opened it. A map in one part folds its steps alone; the
     plain parts line (parts that are not one per strip) holds no picture
     and stays on the face. A preparing card (preparingCard) keeps its
     steps. */
  const how = OE.el('details', { class: 'oe-how', id: 'oe-check-how' }, OE.el('summary', {}, HOW));
  function foldHow() {
    // r5-m B3, after review: a card that show() replaced (its action is off the page, a reply of its press came late)
    // neither places its fold nor takes the new card's strips card.
    if (how.isConnected || !action.isConnected || !models.some((m) => m.kind === 'drawn')) return;
    const moved = [steps, root.querySelector(':scope > .card.oe-strips')].filter(Boolean);
    if (!moved.length) return;
    how.append(...moved);
    OE.toastRegion().after(how);
  }
  renderAll();
  // Shown again (the user comes back from labelling elsewhere): each drawn
  // zone's counts are read again.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && action.isConnected) {
      models.filter((m) => m.kind === 'drawn').forEach((m) => refreshZone(m));
    }
  });
}

/* A class map without top-k scores (the refusal's view: ok false with its
   reason; r4-h C6): the title and the map's name, the two lines that say it
   can be checked on points, one contained button that sends Claude that
   request with the result's id (OE.JOB_TEXT.points, the view's
   points_request; no button without a valid id), a message the host does
   not take shown to type (OE.sendJob), and in a closed Details fold what the
   check gives (POINTS_GRID, r5-e K7) and the tool's own sentence. One
   message per press (OE.oncePerPress, r5-n JS-1). */
function classMapCard(app, data, reason) {
  const id = /^[A-Za-z0-9_.:-]{1,200}$/;
  const ask = data.points_request && typeof data.points_request === 'object' ? data.points_request : {};
  const resultId = typeof ask.result_id === 'string' && id.test(ask.result_id) ? ask.result_id : null;
  const predictionId = typeof ask.prediction_id === 'string' && id.test(ask.prediction_id) ? ask.prediction_id : null;
  root.append(OE.el('h2', {}, TITLE));
  const map = data.map && typeof data.map === 'object' ? data.map : {};
  const mapLine = [map.name, map.period_text].filter((s) => typeof s === 'string' && s).join(', ');
  if (mapLine) root.append(OE.el('div', { class: 'small muted' }, mapLine));
  const typed = OE.typeSlot();
  const button = resultId ? OE.el('button', {
    class: 'primary',
    onclick: OE.oncePerPress(() => OE.sendJob(app, OE.JOB_TEXT.points({ result_id: resultId, prediction_id: predictionId }), typed)),
  }, ON_POINTS) : null;
  root.append(OE.el('div', { class: 'card stack' },
    ...CLASS_MAP.map((s) => OE.el('div', {}, s)),
    button ? OE.el('div', { class: 'row' }, button, typed) : null));
  root.append(OE.fold(DETAILS, OE.el('div', { class: 'small' }, POINTS_GRID), OE.el('div', { class: 'small' }, reason)));
}

/* A map of numbers that is not a score from 0 to 1 (r5-b X1; the refusal's
   view: ok false with the server's two plain lines, error and next,
   server.CHECK_NUMBER_MAP and CHECK_NUMBER_MAP_NEXT): the title and the two
   lines in a plain card, each whole, as text. No press, no count and no
   fold: the tool's own sentence, which names the tool Claude needs, is in
   Claude's text only. */
// WORDING: r5b X1 (the server's words, shown whole)
function numberMapCard(data, next) {
  root.append(OE.el('h2', {}, TITLE));
  root.append(OE.el('div', { class: 'card stack', id: 'oe-check-numbers' },
    OE.el('div', {}, data.error), OE.el('div', {}, next)));
}

/* A card whose map is still being prepared (r5-h H1: the view data says
   preparing, with no zones, when the server's read of a large map runs
   past its wait for a tool call): the title, the map's line when the view
   has it, or once a status answer gives it (under the title, drawn once),
   the four step panels (step 1 as written: no part's square is known yet)
   and one line (PREPARING with the server's stage, a status that a screen
   reader hears change, written only when its words change) beside a quiet
   mark that turns, then, outside that status, PREP_FILLS (r5-j B5: the card
   fills in by itself; it goes with the mark). No press, no counts, no rule
   and no box, so nothing can be picked or typed before the card fills in.
   Every PREP_ASK_MS after an
   answer the card asks olmoearth_app_check_status about its result (an ask
   that fails, or whose answer it cannot read, is asked again): preparing,
   its line takes the new stage; ready, show draws the status's view, the
   same view data a map read in time gives, so the card is the one a card
   that opened ready is, and it tells Claude its parts as that card does
   (tellCard), then, once, for a card of parts, what olmoearth_check_map
   would have answered in time (the status's model_text after READY_TOLD,
   part 'check', sent whole as a block of its own after the facts, r5-i B10:
   so Claude needs no second call, which would draw a second card; none of
   it on the card); failed, show draws the failed card from the status's view
   (r5-a K4, r5-d R01), and Claude is told that the preparation ended
   without a check, with the words that card shows for it
   (PREP_TOLD_FAILED, cardWords), as for a ready card with no part to
   check. Either way a screen reader hears it (#oe-check-said:
   PREP_SAID_READY for a card of parts, else PREP_SAID_ENDED); the focus
   stays where it is. From PREP_LIMIT_MS after it was drawn the card asks
   no more and says the map took too long (PREP_TOO_LONG), its line the red
   card of the failed card (r5-j B5), still the status. The asks stop
   when another card is drawn in its place (stopAsking, run by show) and
   when Claude closes the panel (OE.cleanups). */
function preparingCard(app, data) {
  const title = OE.el('h2', {}, TITLE);
  root.append(title);
  const mapLine = mapLineOf(data.map);
  let lined = Boolean(mapLine);
  if (lined) root.append(OE.el('div', { class: 'small muted' }, mapLine));
  const steps = fig('steps', [...STEPS]);
  if (steps) root.append(steps);
  const stageOf = (s) => (typeof s === 'string' && s.trim() ? s.trim() : null);
  const words = OE.el('span', {}, PREPARING(stageOf(data.stage)));
  const mark = OE.el('span', { class: 'oe-prep-mark', 'aria-hidden': 'true' });
  const row = OE.el('div', { class: 'oe-preparing', id: 'oe-check-preparing', role: 'status' }, mark, words);
  // r5-j B5: under the status, outside it, so a new stage is heard without it: the card fills in by itself.
  const fills = OE.el('div', { id: 'oe-check-fills' }, PREP_FILLS);
  root.append(row, fills);
  const resultId = typeof data.result_id === 'string' && data.result_id ? data.result_id : null;
  if (!resultId) {
    mark.remove();
    fills.remove();
    words.textContent = PREP_NO_ID;
    return;
  }
  OE.tellClaude(app, PREP_TOLD(resultId));
  const since = Date.now();
  let stopped = false;
  let timer = null;
  const stop = () => {
    stopped = true;
    clearTimeout(timer);
    OE.cleanups.delete(stop);
  };
  stopAsking = stop;
  OE.cleanups.add(stop);
  const tooLong = () => {
    stop();
    mark.remove();
    fills.remove();
    // r5-j B5: the red card of the card that could not start (show's failed card), still the status.
    row.className = 'card error';
    words.textContent = PREP_TOO_LONG;
    OE.tellClaude(app, PREP_TOLD_LONG(resultId));
  };
  const ask = async () => {
    if (stopped) return;
    if (Date.now() - since >= PREP_LIMIT_MS) { tooLong(); return; }
    let got = null;
    try {
      got = await OE.call(app, 'olmoearth_app_check_status', { result_id: resultId }, { timeout: PREP_ASK_WAIT_MS });
    } catch (_) { got = null; }
    if (stopped) return;
    const state = got && typeof got.state === 'string' ? got.state : null;
    // The status's view, as show reads a tool result's (OE.viewData: an app tool's structuredContent); never a
    // preparing one again, which would draw this card anew.
    const view = got && got.view && typeof got.view === 'object' && got.view.preparing !== true ? got.view : null;
    if ((state === 'ready' && view) || state === 'failed') {
      stop();
      const drawn = view || { tool: 'olmoearth_check_map', ok: false };
      show(app, { structuredContent: drawn });
      // A card of parts tells Claude its own parts (tellCard); any other card (the failed card, a sign-in, a card
      // with no part to check) tells nothing, so Claude is told that the preparation ended without a check, with
      // the words that card shows for it (cardWords).
      const parts = drawn.ok === true && Array.isArray(drawn.zones)
        && drawn.zones.some((z) => z && typeof z === 'object');
      // The preparing line, the card's status, went with it: a screen reader hears the card fill in or end here.
      if (heard) heard.textContent = parts ? PREP_SAID_READY : PREP_SAID_ENDED;
      if (!parts) OE.tellClaude(app, PREP_TOLD_FAILED(resultId, cardWords(drawn)));
      // r5-i B10: what olmoearth_check_map would have answered in time, once, after the card's own line (tellCard);
      // never on the card. Only a ready answer of a card of parts carries it (none says "Its map is read" beside
      // PREP_TOLD_FAILED). Whole, in a block of its own: never cut, and never under the facts' head.
      const told = state === 'ready' && parts ? modelTextOf(got) : null;
      if (told) {
        const said = READY_TOLD + told;
        OE.tellClaude(app, said.length <= OE.CONTEXT_WHOLE_MAX ? said : READY_TOLD_LONG(resultId), 'check',
          { whole: true });
      }
      return;
    }
    if (state === 'preparing') {
      // A status says its line once per stage, not on every answer (a write would be heard again).
      const next = PREPARING(stageOf(got.stage));
      if (words.textContent !== next) words.textContent = next;
      // The map's line once the server knows it (after the download), under the title, once.
      const later = lined ? '' : mapLineOf(got.map);
      if (later) {
        title.after(OE.el('div', { class: 'small muted' }, later));
        lined = true;
      }
    }
    if (Date.now() - since >= PREP_LIMIT_MS) { tooLong(); return; }
    timer = setTimeout(ask, PREP_ASK_MS);
  };
  timer = setTimeout(ask, PREP_ASK_MS);
}

/* The Studio sign-in, as the result card offers it; once signed in, one
   contained button asks Claude to run the check again, once per press
   (OE.oncePerPress, r5-n JS-1). */
function signIn(app, tool) {
  const panel = OE.signInPanel(app, {
    acceptCurrent: true,  // signed in since, in another panel: no page needed
    // The note's two plain lines (r5-b J19), the panel's (common.js); r5-e K6: the card's own first line
    // said the heading again.
    // WORDING: r5e
    // WORDING: r5b J19
    note: [OE.SIGN_IN_OPENS, OE.SIGN_IN_KEY_GOES],
    onDone: (status) => {
      const typed = OE.typeSlot();
      const again = OE.el('button', {
        class: 'primary', onclick: OE.oncePerPress(() => OE.sendJob(app, 'I have signed in to OlmoEarth Studio. Run ' + tool + ' again.', typed)),
      }, 'Run it again');
      panel.replaceWith(OE.el('div', { class: 'card stack' },
        OE.el('div', {}, OE.accountLine(status.account)),
        OE.el('div', { class: 'row', style: 'justify-content:flex-end' }, again, typed)));
      OE.focusIfHere(again);
    },
  });
  return panel;
}

/* The card for a tool result's view data, or for the view a preparing
   card's status gave (preparingCard: one function for a card that opened
   ready and for one that became ready, r5-h H1). Any preparing card drawn
   before stops asking first, and what a screen reader last heard of one
   (#oe-check-said) is emptied, so each card starts silent. r5-i B10: what a
   card that became ready passed on to Claude for its result (part 'check')
   is dropped, so a card drawn in its place, for its own tool result, never
   carries an older result's text. */
function show(app, params) {
  stopAsking();
  if (heard) heard.textContent = '';
  const data = OE.viewData(params);
  OE.disposeEditors(root);
  OE.tellClaude(app, '', 'check');
  // r5-m B3, after review: the page's one status line, which checkCard moved under its press, goes back under
  // #root, before Settings (r5-n S1), before #root is drawn again (made at the page's foot if it is missing), so
  // every card starts with the region where OE.start put it, and checkCard's action.after(OE.toastRegion()) moves it
  // again.
  const bar = OE.toastRegion();
  if (root.contains(bar)) root.after(bar);
  root.replaceChildren(OE.el('div', { class: 'overline' }, 'Accuracy check'));
  if (data.needs_sign_in) {
    root.append(signIn(app, data.tool || 'olmoearth_check_map'));
    return;
  }
  const reason = typeof data.reason === 'string' && data.reason ? data.reason : null;
  if (!data.ok && reason) {
    classMapCard(app, data, reason);
    return;
  }
  // A map of numbers that is not a 0-to-1 score (r5-b X1): the server's two plain lines.
  const next = typeof data.next === 'string' && data.next ? data.next : null;
  if (!data.ok && next && typeof data.error === 'string' && data.error) {
    numberMapCard(data, next);
    return;
  }
  if (!data.ok) {
    // The check could not start (r5-d R01): the title, one plain line in the
    // red card, and the server's words (its plain error, and a hint when the
    // view holds one) in a closed Details fold. A refusal the server wrote for
    // this card's face (data.plain: a map that is not a score from 0 to 1,
    // r5-a K2) is the red card's first line instead, over the plain line, with
    // no fold.
    root.append(OE.el('h2', {}, TITLE));
    const own = data.plain === true && typeof data.error === 'string' && data.error ? data.error : null;
    root.append(OE.el('div', { class: own ? 'card error stack' : 'card error' },
      own ? OE.el('div', {}, own) : null, OE.el('div', {}, CHECK_FAILED)));
    const said = own ? [] : [data.error, data.hint].filter((s) => typeof s === 'string' && s);
    if (said.length) root.append(OE.fold(DETAILS, ...said.map((s) => OE.el('div', { class: 'small' }, s))));
    return;
  }
  const zones = (Array.isArray(data.zones) ? data.zones : []).filter((z) => z && typeof z === 'object');
  const must = Array.isArray(data.must_state) ? data.must_state : [];
  // The map is still being prepared on the server (r5-h H1): its card fills in by itself.
  if (data.preparing === true) {
    preparingCard(app, data);
    return;
  }
  if (zones.length) {
    const most = Number.isInteger(data.draws_max) && data.draws_max > 0 ? data.draws_max : DRAWS_MAX;
    checkCard(app, data, zones, must, typeof data.result_id === 'string' ? data.result_id : null, most);
    return;
  }
  root.append(OE.el('h2', {}, TITLE));
  if (typeof data.resolved === 'string' && data.resolved) root.append(OE.el('div', { class: 'small muted' }, data.resolved));
  root.append(OE.el('div', { class: 'card' }, reason || NO_PART));
  if (must.length) root.append(notesBlock(must));
}

await OE.start('olmoearth-check', {
  onResult: (params, app) => show(app, params),
  // The host's display mode (full screen, and back): the label editor's face follows it.
  onContext: (ctx) => OE.sheetMode(ctx.displayMode),
});
</script>
</body>
</html>
