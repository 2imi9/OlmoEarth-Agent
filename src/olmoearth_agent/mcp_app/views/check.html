<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OlmoEarth accuracy check</title>
<script type="importmap">{"integrity": {"@EXT_APPS_URL@": "@EXT_APPS_SRI@"}}</script>
<link rel="modulepreload" href="@EXT_APPS_URL@" integrity="@EXT_APPS_SRI@" crossorigin="anonymous">
<style>
  /* r5-f F16: the canvas and the text before the module runs, and when it
     cannot start (the watchdog's line): OE.STYLE's own canvas and text
     colours and a system sans-serif, which OE.STYLE takes over from once
     the module runs. */
  html { background: #faf2e9; }
  body { margin: 0; padding: 0 16px 16px; font: 14px/21px system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0a3235; }
  .notes p { margin: 0 0 4px; }
  .ask { margin: 0; font-weight: 600; }
  /* A part's counts: one button each, the count in bold (no drawing: r4-h
     C1; no words under it since r5-e K1: one line under the question says
     them once). One grid of equal columns, every count as wide and as tall
     as the others (r5-e K1, common.js .oe-same), wrapping on a narrow panel,
     so the card never scrolls sideways. Under 480 px each count is a row of
     its own (r5-b J29 c: three counts broke two and one there, the third
     stretched). A column is 132 px at least, a count's own least width:
     inside a part's card three counts then stay on one row from 481 px up
     (at 140 px they broke two and one from 481 to 501 px). */
  .pick-group { --same-min: 132px; max-width: 100%; }
  .pick-group button.pick { display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    min-width: 132px; padding: 8px 12px; text-align: left; font-weight: 400; }
  .pick-group button.pick[aria-pressed="true"] { background: var(--selected); border-color: var(--text);
    box-shadow: inset 0 0 0 1px var(--text); }
  /* r5-m B7: a chosen number carries a tick before it, as a chosen answer
     on the label sheet does (common.js .face .answers), so the two chosen
     looks are one. The tick has empty alt text, so each button's name stays
     its number; it sits inside the count's line and sets no size of its own,
     so the grid keeps every count one size (R1). After review: the count's
     line never breaks (nowrap), so a chosen count is one line like the
     others; at the narrowest columns (132 px from 481 px, about 107 px of
     text) a four-digit count with its tick runs into the button's right
     padding, inside its border. The browser check measures a chosen count
     of three digits at 780, 520, 490, 481 and 380 px, and of four digits on
     a map in two parts at the same widths (one line, inside its button). */
  .pick-group button.pick[aria-pressed="true"] .pick-count::before { content: "\2713\00a0"; content: "\2713\00a0" / ""; }
  .pick-count { font-size: 14px; line-height: 21px; white-space: nowrap; }
  .pick-count strong { font-size: 16px; font-weight: 700; }
  @media (max-width: 480px) {
    .pick-group button.pick { flex: 1 1 100%; min-width: 0; flex-direction: row; align-items: baseline;
      justify-content: space-between; }
  }
  @media (max-width: 480px) { .pick-group { --same-min: 100%; } }
  /* Why a map is in parts (r5-e K3): the docs' picture of the world cut into
     strips, one in pink, and its one line beside it (under it on a narrow
     panel), in one white card. .card.oe-strips beats common.js's .card. */
  .card.oe-strips { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px; }
  .oe-strips img { display: block; width: 100%; max-width: 360px; height: auto; border-radius: 2px; }
  .oe-strips > div { flex: 1 1 200px; min-width: 0; }
  /* Free text in the white cards (a typed rule, the server's words on a
     part that cannot be checked): a word too long for its line breaks, so it
     never runs out of its card, nor makes a map in one part scroll sideways. */
  .gate, section.part { overflow-wrap: anywhere; }
  /* The same for a part's lines in Details (r5-f F04: the server's words on
     a sheet that cannot be read, which name the sheet's file, are there). */
  .fold-part { overflow-wrap: anywhere; }
  .gate input[type=text] { width: 100%; }
  /* The gate takes the focus after a press with no reply (its one line says
     what to do, drawPicked): the ring only for a keyboard, as on the sheet's
     face (common.js .face). */
  .gate:focus { outline: none; }
  .gate:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  /* The box's label, in body type: beside the owner's rule (r4-h C5), and on
     the gate that asks for a rule (r5-b J18). */
  .gate label.own-rule { display: block; margin-bottom: 4px; }
  /* The small line under the box (r5-b J18): the gate's example, or what an
     empty box does. */
  .gate .under-box { margin-top: 4px; }
  .oe-more > * + * { margin-top: 8px; }
  .oe-more p { margin: 0; }
  .fold-part + .fold-part { border-top: 1px solid var(--divider); padding-top: 8px; }
  .fold-head { font-weight: 600; }
  /* The two example pictures beside the owner's rule (r4-k K9), small, side
     by side, each over its caption; they wrap on a narrow panel. */
  .oe-examples { display: flex; flex-wrap: wrap; gap: 12px; }
  .oe-examples figure { margin: 0; width: 120px; max-width: 100%; display: flex; flex-direction: column; gap: 4px; }
  .oe-examples img { display: block; width: 100%; height: auto; border: 1px solid var(--divider); border-radius: 4px; }
  /* r5-l L2: the one small line under the two example pictures that says
     where they come from (EXAMPLES_SOURCE), close under their captions, in
     the same white card (examplesBlock). */
  .oe-examples-from { margin-top: 4px; }
  /* A card whose map is being prepared (r5-h H1): one line, a quiet mark
     that turns beside its words. The mark holds no number (nothing says how
     much is done), is hidden from a screen reader, and stands still for a
     reader who asks for less motion. r5-j B5: the mark sits by the line's
     first row, not halfway down a line that wraps (380 px), and its turning
     edge is in the text's colour, var(--text) (it was var(--text-2), a
     slightly lighter dark teal; the pale ring, var(--divider), is unchanged). */
  .oe-preparing { display: flex; align-items: flex-start; gap: 8px; }
  .oe-prep-mark { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--divider);
    border-top-color: var(--text); margin-top: 4px; animation: oe-prep-turn 1.6s linear infinite; }
  @keyframes oe-prep-turn { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .oe-prep-mark { animation: none; } }
  /* What a screen reader hears when a preparing card fills in or ends (r5-h
     H1, #oe-check-said): a status outside #root, so it outlives the card it
     speaks for, and on no face (as .oe-type's empty slot). */
  .oe-said-hidden { position: absolute; width: 1px; height: 1px; margin: 0; overflow: hidden; clip-path: inset(50%);
    white-space: nowrap; }
  /* r5-k K6: the closed fold "How this check works" (#oe-check-how,
     foldHow) that holds the four step panels and the strips card once a
     part is drawn, spaced as Details is (common.js .oe-more): 8 px under
     its summary, 12 px between what it holds. Its own class, so Details
     stays the card's one .oe-more fold. */
  .oe-how > summary + * { margin-top: 8px; }
  .oe-how > * + * { margin-top: 12px; }
</style>
</head>
<body>
<main id="root" class="stack"><div class="muted">Waiting for the result...</div></main>
<div id="oe-check-said" class="oe-said-hidden" role="status" aria-live="polite"></div>
<script>
// WORDING: r4k K2
setTimeout(function(){if(!window.OE_STARTED){var r=document.getElementById('root');if(r)r.textContent='This card could not start here. Carry on in the chat.';}},10000);
</script>
<script type="module">
import { App } from "@EXT_APPS_URL@";
/*@SCRIPTS@*/

/* The Check card (olmoearth_check_map): one Studio result, one map per UTM
   zone, which the card calls a part (the server's part names). Figure first:
   the title and the map's name and period, four small step pictures
   (OE.fig.steps: a schematic, never this map's data; step 1 names the
   square's size when every part has the same), the labelling rule (the
   gate for a map with no rule of the owner's, its box with an example in
   a small line under it; for a map of presence and absence the rule that
   came with the app and its scope, with a box for the map maker's meaning
   while no part of it is drawn: the owner's ruling of 13 Nov 2026, option
   A, worded for any map since r5-l L2; a rule typed for this map, read
   only; beside the owner's rule, when the server sends them, two example
   pictures, captioned with what Present and Absent mean in general words,
   with one small line under them on where they come from (r5-l L2), and
   whose place line is in Details: r4-k K9),
   "How many squares do you want to check?" (once no part offers a number:
   "Your squares", or that every square is answered: r5-b J17), one line
   under it on what more squares give (r5-e K1, while a part offers more
   than one number) and, for a map in several parts, the docs' picture of
   the world cut into strips with the line that says so, in one card (r5-e
   K3; only where each part is a strip of its own: any other map in parts
   gets the plain line on its parts, with no picture), then each part in a
   white card of its own (r5-e K2: no parts figure
   on this card), its name and size over its group of counts (each count
   alone, no words, no drawing) or its state, said once; then the line on
   what the press fixes, the press, and under it one line that says why it
   is off or which parts it leaves out (r5-b J08). Once a part is drawn the
   four step pictures and the strips card go into a closed fold, "How this
   check works", after the press or the open sheet and before Details, so
   the parts and their sheets come first (r5-k K6: foldHow).
   Everything else (the planner's sentences and rate notes, each part's
   size and file and zone, the square's size, design and seed, the
   pictures' limit, must_state) is in one closed Details fold. A map that is
   one score from 0 to 1 (r5-a K3) has one read-only line of the server's
   right over the gate, its cut (the view's cut; the same line is among the
   notes in Details), and its Details say per part how many pixels outside
   0 to 1 were set to the nearest end, when any were (K2). A class map
   without scores gets the refusal's face: two lines, a button that sends
   Claude the check on points (OE.JOB_TEXT.points) and the tool's sentence
   in Details. A map of numbers that is not a score from 0 to 1 gets the
   server's two plain lines and nothing else (r5-b X1). A map still being
   prepared on the server (r5-h H1: a large map's first read runs past the
   server's own wait, CHECK_WAIT_SECONDS, 20 s, which keeps the answer well
   inside the host's limit) gets the title, its map's line when known, the
   four steps and one line on how far the preparation is, and asks
   olmoearth_app_check_status until the map is ready, then draws the card
   above with the same function (preparingCard, show).

   Nothing is picked for the user (a second press on a count unpicks it). One
   press (olmoearth_app_check_draw) picks the parts' squares, each once, with
   the count, design random and seed 0 fixed and logged on the server, and
   the typed labelling rule when the gate asked for one or the box holds
   one (an empty box keeps the owner's rule); the rule the card shows after
   a press is the one the server's reply gives (r4-h Q4, Q11), and after a
   press with no reply none, only the line that sends the user to Claude to
   see it (RULE_LOST), and the card picks nothing more: no part offers a
   number after it (r4-i F6, r5-b J09); then the
   first part
   picked opens in the label editor in place of the press, and the press is
   not shown while an editor is open (the editor has its own contained
   button). A part picked earlier keeps a button that opens its sheet; with
   no part left to pick, the first of these is the contained one. Under an
   open editor each other part's own card says its state (r5-e K2).

   The card computes nothing and shows no rate, interval, estimate, suggested
   label, sort or figure of the map: only counts, the server's sentences
   and each drawn sheet's progress
   (olmoearth_app_sheet_progress, counts only). Nothing takes the focus on load; after a press the focus
   goes on only from the button pressed (OE.focusIfHere; after a press with
   no reply, to the gate's line, which says what to do). The card tells
   Claude silently (OE.tellClaude) the result's id and, by zone name, which
   zones are drawn, with each sheet's counts, name and path: ids and counts
   only, each zone a clause of its own, cut only between clauses
   (OE.fitClauses). Never the map's Studio name, nor the typed rule. A card
   of parts that became ready (preparingCard) adds, once, in a block of its
   own after those facts and under its own lead (READY_TOLD, never the
   facts' head), the server's own text for Claude (r5-i B10: model_text,
   olmoearth_check_map's answer in time word for word, the server's notes
   included, and so the map's pinned rule, labelling_rule, a typed one too,
   as that answer holds it), never anything the card read or the user typed
   here.

   One press is one call, of at most draws_max parts (the server's limit,
   in the view data): the failed picks it retries first, at most draws_max
   (a retry has no count to unpick), then the counts picked, up to the room
   left. Picks past that room turn the press off, and a line says how many
   to unpick; when the failed picks alone pass draws_max, the press stays
   on, retries the draws_max that have waited longest (the server's
   failed_at, earliest first: r4-l L2, so a pick past the limit gets its
   turn), the line says the rest wait for the next press, and each part that
   waits says it is not in this press and waits for a later one (RETRY_LATER). The press is
   off too while the gate's rule is shorter than RULE_MIN characters, or
   the box holds 1 to RULE_MIN - 1 (code points of
   the rule as the server keeps it: ruleText). The call may run long (each
   part's plan runs on the server), so it waits up to PRESS_WAIT_MS; a call
   that gets no answer back (the host's timeout, a dropped bridge) never
   says nothing was picked, since the server may have drawn: the card sends
   the user to Claude to open it again, and leaves every other part for
   that card too (r5-b J09).
   While a press is answered no sheet opens; opening another part's sheet
   first saves the one open here, and keeps it open when that save fails; the
   line that says so (NOT_SWAPPED) is the sheet's own, in its footer under
   Save labels, in place of that line's "Press Save labels to try again.",
   and it goes once a save is taken (r5-m B3, after review: a toast, it stayed
   under the other sheet, asking to press a Save labels no longer drawn), and
   on a card of parts the status line sits right under the press or the
   sheet, before the fold on how the check works and Details. An
   editor that stopped saving (its sheet changed under the panel) gives way
   at once, and its part's own red line, and one toast, say how many answers
   for which part were not saved and what to do (r5-b J10); when none were,
   its last toast about that change is cleared
   (r4-l L3), so no old line stays under the other sheet. */

const root = document.getElementById('root');

/* The card's own words. Each holds square, part or range unless marked
   r4p2, so one grep (WORDING: squares) swaps the word. The server's
   sentences are shown whole, in Details. */
// WORDING: squares
const TITLE = 'Check how wrong this map is';
/* Step 3 says what the one who looks must recognise (r5-f F09: it said
   "recognise it", and nothing on the face is "it"). r5-m B1: what the map is
   meant to find (it said "what the map shows", read as the map's own answer
   at the square, which the blind sheet hides), the words of the rule. */
// WORDING: r5m B1 (step 3)
// WORDING: r5f F09 (step 3)
// WORDING: squares; r4h critic gap 2 (step 3)
const STEPS = [
  '1. The map is cut into small squares.',
  '2. The app picks some at random.',
  '3. Someone who can recognise what the map is meant to find looks at each one in a satellite picture.',
  '4. You get how often the map is wrong, with a range.',
];
/* Step 1 with the square's size (r4-h A/F13), when every part's is known
   and rounds to the same metres. */
// WORDING: r4h A/F13
const STEP_SIZED = (metres) => '1. The map is cut into squares about ' + metres + ' m a side.';
// WORDING: squares
const ASK = 'How many squares do you want to check?';
/* The same heading once no part offers a number (r5-b J17: it still asked
   with nothing to choose): every picked part answered whole and no sheet
   open here, or, any other way, the squares picked. r5-f F11: "the sheet"
   on a map in one part (it said "a sheet" on a map with one), "a part's
   sheet" on a map in parts (several). r5-i B2: "each part's sheet in turn"
   when more than one part has a sheet (several: fillAsk), since one press
   gives one part's result, never the map's; "the sheet" when one part has
   one, on a map in parts too whose other parts cannot be checked or failed
   for good. r5-j B3: on a map in parts the press is in each part's sheet,
   and the line says that each gives one result ("Open each part's sheet in
   turn, then press" still read as one press for the map); the line on one
   part keeps its words. */
// WORDING: r5j B3
// WORDING: r5i B2
// WORDING: r5f F11
// WORDING: r5b J17
const ALL_ANSWERED = (several) => 'Every square is answered. '
  + (several ? 'In each part\'s sheet, press Estimate the error rate: one result per part.'
    : 'Open the sheet, then press Estimate the error rate.');
/* The same heading once a drawn sheet already gave its result (r5-m, after
   review: since the sheet track's B5 such a sheet's finish button reads
   GRADED_FINISH, sheet.js W.gradedFinish, so "press Estimate the error
   rate" named a button the sheet no longer has): every drawn part's sheet
   gave one and none changed since (named), the button by those words; else
   (only some did, or one changed since, whose button reads otherwise,
   W.gradedChanged) no button by its words, since each sheet names its own.
   The owner or the leads may pick other words. */
// WORDING: r5m (after review: the sheet's B5 words, sheet.js W.gradedFinish)
const GRADED_FINISH = 'Show the result again';
// WORDING: r5m (after review: a graded sheet's heading)
const ALL_GRADED = (several, named) => 'Every square is answered. '
  + (named ? (several ? 'In each part\'s sheet, press ' + GRADED_FINISH + ': one result per part.'
    : 'Open the sheet, then press ' + GRADED_FINISH + '.')
    : several ? 'Open each part\'s sheet to get its result: one result per part.'
      : 'Open the sheet to get its result.');
// WORDING: r5b J17
const YOUR_SQUARES = 'Your squares';
/* One line under the question (r5-e K1), while a part offers more than one
   number: a count's button says only its number of squares. Before, each
   count carried words by its place among its part's counts (r5-b J03), the
   same in every part (nine small lines on a map in three parts). Each
   count's planner sentence stays in Details. */
// WORDING: r5e
const MORE_WORK = 'More squares: more work, and a narrower range.';
/* The line over the press (r4-h C2: B/check-press-fixes and C/check-7
   FINALs): what the press fixes and what stopping means. What a random pick
   misses is said in Details only (RARE): r5-b J18 took that third sentence
   off the face. r5-e K4: one line at 780 px; that the user can stop and
   come back is the sheet's "Saved automatically". */
// WORDING: r5e
// WORDING: r5b J18
// WORDING: r4h C2
const CANNOT = 'Once you press, your rule and number are fixed. You get a result once every square is answered.';
// WORDING: squares
const PRESS = 'Pick the squares';
/* For a user who comes back (r5-a L4): a card drawn before a part was
   picked still shows that part's counts, and a second press picks nothing
   new (the server opens the squares picked before). In Details since r5-e
   K4 (it was a small grey line under the press), under the rule it had
   there: only while the card has a press and shows no part as picked or as
   pressed with no reply (beside a picked part the press picks another
   part's new squares; with no press, "Press again" has nothing to press). */
// WORDING: r5a L4
const PICKED_BEFORE = 'Picked before? Press again: the same squares open.';
/* Why a map is in parts, beside the docs' picture of the world cut into
   strips (r5-e K3; Studio saves one map per strip and side of the equator,
   server.py: one per UTM zone, which the card calls a part). The picture is
   a JPEG of views/brand (views.BRAND), inlined into this view alone; it
   holds no place, no text. Shown, with this line, only on a map whose parts
   are each a strip of their own (checkCard's byStrip), where it is true. */
// WORDING: r5e
// WORDING: squares
const PARTS_LINE = (n) => 'Studio saves a map in one part for each strip of the world it covers, like the pink strip'
  + ' here. This map has ' + n + ' parts; each gets its own check.';
const STRIPS = '@STRIPS_DATA_URL@';
/* The same card with no picture, for any other map in parts: one strip on
   both sides of the equator (two parts, "North part" and "South part", in
   one strip of the picture), a file that is no strip of that grid, or a
   strip saved twice. The strips sentence is untrue there, so the line says
   only how many parts and that each is checked (r5-b J18's words). */
// WORDING: r5e
// WORDING: squares
const PARTS_PLAIN = (n) => 'This map is saved in ' + n + ' parts. Each part gets its own check.';
/* The closed fold that holds the four step panels and the strips card once
   a part is drawn (r5-k K6, the owner's choice of 18 Nov 2026 on O22:
   foldHow), so the parts and their sheets come first. */
// WORDING: r5k K6
const HOW = 'How this check works';
// WORDING: squares
const PICKED = (n, day) => OE.counted(n, 'square') + ' picked on ' + day + '.';
/* A press on a part picked before (in another window): what stays, and that
   the number chosen on this card is not used (r5-b J17). */
// WORDING: r5b J17
// WORDING: squares
const REPEATED = (n, day) => 'Already picked on ' + day + ': ' + OE.counted(n, 'square')
  + '. That pick stays; the number chosen now is not used.';
/* A part's own red line, and the toast, once its editor gave way with
   answers it could not save (r5-b J10): the part by its name, how many
   answers, and the next step. The sheet's file name stays in Details. */
// WORDING: r5b J10
const NOT_SAVED_PART = (k, name) => OE.counted(k, 'answer') + ' for ' + name + (k === 1 ? ' was' : ' were')
  + ' not saved: its sheet was changed somewhere else. Open its sheet again and answer '
  + (k === 1 ? 'that square' : 'those squares') + ' again.';
// WORDING: squares
const SQUARES_GROUP = (name) => 'Squares to check' + (name ? ' in ' + name : '');
/* A part's heading with its size (r4-h A/F11): "West part (1,234 squares
   in all)", the name alone when its count of squares is not known. r5-j B6:
   "in all", since "(300 squares)" right over the count buttons ("20
   squares", "80 squares") read as a fourth count or as the work to do. */
// WORDING: r5j B6
// WORDING: r4h A/F11
const PART_HEAD = (name, n) => name + (Number.isInteger(n) && n >= 0
  ? ' (' + n.toLocaleString('en-US') + (n === 1 ? ' square in all)' : ' squares in all)') : '');
/* A part with no name of the server's (V6: never the zone's name on a face). */
// WORDING: r4h V6
const PART_N = (i) => 'Part ' + i;
// The labelling-rule gate (a map with no rule of the owner's): no red line
// (r4-h C4, C/check-1 FINAL), the ask, the box's label in body type and,
// in a small line under the box (never sent), an example. r5-b J18: the
// example was the box's grey placeholder, which went at the first key.
// WORDING: r4h C4
const RULE_ASK = 'First write, in one sentence, how you will decide what class a square is. It is saved and shown'
  + ' with the result.';
// WORDING: r4h C4
const RULE_LABEL = 'Your rule';
// WORDING: r4h C4
const RULE_HINT = 'For example: the class that fills most of the outlined square';
// In Details (r4-h C4) while the map's rule is not the owner's.
// WORDING: r4p2
const RULE_PICTURES = 'The pictures are 10 m satellite images. They may not show what this map looks for.';
// WORDING: r4p2
const RULE_SHOWN = (text) => 'Labelling rule: “' + text + '”';
// WORDING: r4p2
const RULE_FIRST = 'Write the labelling rule first, in one sentence of at least 10 characters.';
// Under the press, within the most parts one press picks (r5-b J08: nothing
// beside a grey press said why, and nothing said that a part left without a
// number is skipped): the rule and a number are missing, or a number is; and,
// on a map in parts, which parts that still offer numbers this press leaves
// out, by name (up to three; more by their number).
// WORDING: r5b J08
const RULE_AND_NUMBER = 'Write your rule and choose a number of squares first.';
