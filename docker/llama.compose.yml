# Local development compose for the OlmoEarth Agent's LLM backend.
# Serves the 4-bit GGUF via llama.cpp (OpenAI-compatible API).
# Canonical values: docs/CANON.md (C1 model, C3 server, C5 env vars).
# Requires an NVIDIA GPU + nvidia-container-toolkit (Blackwell, e.g.
# RTX 50-series / B-series). The 4-bit GGUF (~17.7 GB) fits a 24 GB card.
#
# Usage:
#   echo "HF_TOKEN=hf_..." >> .env   # only if the GGUF repo is gated
#   docker compose -f docker/llama.compose.yml up
#
# The host Hugging Face cache (~/.cache/huggingface) is bind-mounted, so the
# ~17.7 GB GGUF downloads once and is reused. `make serve` (scripts/serve-llm.sh)
# sets HF_CACHE_DIR for you, incl. the Windows C:/Users/... form. From a raw
# `docker compose up` in PowerShell/cmd (no $HOME), pass it explicitly:
#   HF_CACHE_DIR=C:/Users/<you>/.cache/huggingface docker compose -f docker/llama.compose.yml up
#
# The agent then reads LLM_ENDPOINT=http://localhost:8000/v1 and
# LLM_MODEL=unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ4_XS from the environment.
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      # First-run download only. A host proxy must be reached as
      # host.docker.internal (inside the container 127.0.0.1 is the container
      # itself). Empty by default => direct connection, so a warm cache is
      # unaffected. e.g. HF_PROXY=http://host.docker.internal:7897
      - HTTP_PROXY=${HF_PROXY:-}
      - HTTPS_PROXY=${HF_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
    # Reach a host proxy via host.docker.internal (host-gateway makes the alias
    # resolve on bare Linux too; harmless on Docker Desktop / when HF_PROXY is empty).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mount the HOST Hugging Face cache so the ~17.7 GB GGUF downloads
      # once and is reused on every fresh `make serve` (no re-pull). Compose
      # expands ${HOME} (not ~); the default is the POSIX cache path. On Windows,
      # scripts/serve-llm.sh exports HF_CACHE_DIR=C:/Users/<you>/.cache/huggingface.
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # --jinja enables tool calling; --no-mmap avoids slow mmap over the
    # Docker Desktop / WSL filesystem bridge; -c 8192 leaves room for a
    # full SKILL.md plus the tool schemas.
    command:
      - -hf
      - unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ4_XS
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --jinja
      - -ngl
      - "999"
      - -c
      - "8192"
      - --no-mmap
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
