# See https://pre-commit.com for usage and config reference.
# Modeled on https://github.com/NVIDIA/earth2studio/blob/main/.pre-commit-config.yaml
# Install once with `uv run pre-commit install`; runs automatically on `git commit`.

default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Two trailing spaces are a Markdown hard line break, and a diff's blank
      # context line is a single space: keep both.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.patch$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # The skill packages' scripts are standalone MIT-licensed helpers shipped as
  # package data (src/olmoearth_agent/skills/packages/README.md); the Python
  # style hooks skip them.
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        exclude: ^src/olmoearth_agent/skills/packages/

  # Ruff lints only; Black is the one formatter (ruff-format also ran here and
  # the two disagreed on several files).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^src/olmoearth_agent/skills/packages/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        files: ^src/
        exclude: ^src/olmoearth_agent/skills/packages/

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [--config=pyproject.toml]
        pass_filenames: false
